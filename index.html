
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurnkeyCFO — Operations Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   MAVS COLOR SYSTEM — official palette only
   Royal Blue #00538C · Navy #002B5E · Silver #B8C4CA
═══════════════════════════════════════════════ */
:root {
  /* Core Mavs */
  --royal:       #00538C;
  --royal-dark:  #003f6b;
  --royal-light: #1a6fa8;
  --royal-pale:  #cce2f2;
  --royal-ghost: #e8f3fb;
  --navy:        #002B5E;
  --navy-dark:   #001a3d;
  --navy-mid:    #003878;
  --silver:      #B8C4CA;
  --silver-dark: #8a9aa4;
  --silver-mid:  #c8d4da;
  --silver-pale: #e8eef2;
  --silver-ghost:#f4f7f9;
  --white:       #ffffff;
  --off-white:   #f8fafc;

  /* Text */
  --t1: #001a3d;   /* primary */
  --t2: #003060;   /* secondary */
  --t3: #4a6a8a;   /* muted */
  --t4: #8aaccc;   /* light */

  /* Borders */
  --b1: rgba(0,83,140,0.12);
  --b2: rgba(0,83,140,0.22);
  --b3: #B8C4CA;

  /* Status — all within Mavs tonal range */
  --s-green:  #0a7a50; --s-green-bg:  #e4f5ef; --s-green-b: #a8dcca;
  --s-yellow: #b06e00; --s-yellow-bg: #fdf5e4; --s-yellow-b:#f0d090;
  --s-red:    #a82010; --s-red-bg:    #fcecea; --s-red-b:   #f0b0a8;
  --s-purple: #5a30a0; --s-purple-bg: #f0ebfc; --s-purple-b:#c8b0ee;

  --shadow-xs: 0 1px 3px rgba(0,27,62,.06);
  --shadow-sm: 0 2px 10px rgba(0,27,62,.08);
  --shadow-md: 0 4px 20px rgba(0,27,62,.11);
  --shadow-lg: 0 8px 40px rgba(0,27,62,.14);
  --shadow-xl: 0 16px 60px rgba(0,27,62,.18);

  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px; --r-full:9999px;
  --ff-h:'Sora',system-ui,sans-serif;
  --ff-b:'Plus Jakarta Sans',system-ui,sans-serif;
  --ease:.18s cubic-bezier(.4,0,.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--ff-b);background:var(--off-white);color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.6}

/* ═══════════════════════════════════════════════
   DASHBOARD LAYOUT
═══════════════════════════════════════════════ */
#dashboard{display:none}
#dashboard.show{display:flex;min-height:100vh}

.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:240px;
  background:var(--navy);
  display:flex;flex-direction:column;z-index:100;
  box-shadow:4px 0 24px rgba(0,27,62,.3);
}
.sidebar::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,transparent 0,transparent 50px,rgba(255,255,255,.014) 50px,rgba(255,255,255,.014) 51px);
  pointer-events:none;
}

.sb-logo{
  display:flex;align-items:center;gap:12px;
  padding:22px 20px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
  flex-shrink:0;position:relative;
}
.sb-gem{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--royal),var(--royal-light));
  border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--ff-h);font-size:14px;font-weight:800;color:#fff;
  box-shadow:0 2px 10px rgba(0,83,140,.5);flex-shrink:0;
}
.sb-words{display:flex;flex-direction:column;gap:1px}
.sb-name{font-family:var(--ff-h);font-size:13px;font-weight:700;color:#fff;line-height:1.1}
.sb-tag{font-size:9px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:rgba(184,196,202,.6)}

/* Sidebar change-file button */


.sb-section{font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:rgba(184,196,202,.45);padding:18px 20px 7px;flex-shrink:0}

.sb-list{padding:0 10px;flex-shrink:0}

.sb-btn{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 12px;border-radius:var(--r-md);
  border:none;background:transparent;cursor:pointer;
  transition:var(--ease);margin-bottom:2px;position:relative;
}
.sb-btn:hover{background:rgba(255,255,255,.07)}
.sb-btn.active{background:rgba(0,83,140,.5);box-shadow:0 2px 10px rgba(0,83,140,.35)}
.sb-btn.active::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:0 3px 3px 0;background:#fff}

.sb-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.av-all{background:linear-gradient(135deg,var(--silver-dark),var(--silver));color:var(--navy)}
.av-ricky{background:linear-gradient(135deg,#8a6000,#c49020);color:#fff}
.av-hardik{background:linear-gradient(135deg,var(--royal-dark),var(--royal));color:#fff}
.av-eldine{background:linear-gradient(135deg,#0a6040,#0d8060);color:#fff}
.av-nik{background:linear-gradient(135deg,var(--s-purple),#7a50d0);color:#fff}
.av-events{background:linear-gradient(135deg,#8a1808,#c02818);color:#fff}

.sb-pname{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.8);flex:1;text-align:left}
.sb-btn.active .sb-pname{color:#fff}
.sb-pbadge{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:var(--r-full);background:rgba(255,255,255,.1);color:rgba(255,255,255,.55)}
.sb-btn.active .sb-pbadge{background:rgba(255,255,255,.2);color:rgba(255,255,255,.9)}

.sb-divider{height:1px;background:rgba(255,255,255,.07);margin:12px 20px}

.sb-vbtn{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 12px;border-radius:var(--r-md);
  border:none;background:transparent;cursor:pointer;
  font-family:var(--ff-b);font-size:12.5px;font-weight:500;
  color:rgba(255,255,255,.55);transition:var(--ease);margin-bottom:2px;
}
.sb-vbtn:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.sb-vbtn.active{background:rgba(0,83,140,.5);color:#fff;font-weight:700}
.sb-vicon{font-size:13px;width:18px;text-align:center}

.sb-footer{margin-top:auto;padding:14px 20px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0}
.sb-live{display:flex;align-items:center;gap:7px;font-size:10.5px;color:rgba(184,196,202,.55)}
.sb-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:blink 2s ease-in-out infinite}
.sb-fname{font-size:10px;color:rgba(184,196,202,.4);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ═══════════════════════════════════════════════
   MAIN AREA
═══════════════════════════════════════════════ */
.main{margin-left:240px;min-height:100vh;display:flex;flex-direction:column}

.topbar{
  background:var(--white);border-bottom:1px solid var(--b1);
  padding:0 32px;height:62px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;box-shadow:var(--shadow-xs);flex-shrink:0;
}
.tb-left{display:flex;flex-direction:column;gap:1px}
.tb-title{font-family:var(--ff-h);font-size:15px;font-weight:700;color:var(--navy)}
.tb-sub{font-size:11px;color:var(--t3)}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-date{font-size:11.5px;color:var(--t3);background:var(--silver-ghost);padding:4px 11px;border-radius:var(--r-full);border:1px solid var(--b1)}
.tv-wrap{display:flex;background:var(--silver-ghost);border:1px solid var(--b1);border-radius:var(--r-sm);padding:3px;gap:2px}
.tv-btn{padding:4px 12px;border-radius:var(--r-xs);border:none;background:transparent;font-family:var(--ff-b);font-size:11.5px;font-weight:600;color:var(--t3);cursor:pointer;transition:var(--ease)}
.tv-btn:hover{color:var(--t1)}
.tv-btn.active{background:var(--white);color:var(--royal);box-shadow:var(--shadow-xs)}

.content{flex:1;padding:26px 32px 48px}

/* ═══════════════════════════════════════════════
   STATS ROW
═══════════════════════════════════════════════ */
.cmd-center{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.cmd-panel{background:var(--white);border:1px solid var(--b1);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.cmd-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.cmd-panel.cp-royal::before{background:linear-gradient(90deg,var(--royal),var(--royal-light))}
.cmd-panel.cp-navy::before{background:linear-gradient(90deg,var(--navy),var(--navy-mid))}
.cmd-hdr{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cmd-hdr-icon{font-size:12px}
.cmd-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--b1)}
.cmd-item:last-child{border-bottom:none;padding-bottom:0}
.cmd-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.cd-red{background:var(--s-red)} .cd-yellow{background:var(--s-yellow)} .cd-royal{background:var(--royal)} .cd-green{background:var(--s-green)} .cd-navy{background:var(--navy)} .cd-silver{background:var(--silver-dark)}
.cmd-item-body{flex:1;min-width:0}
.cmd-item-label{font-size:11.5px;font-weight:700;color:var(--t1);line-height:1.3}
.cmd-item-sub{font-size:10.5px;color:var(--t3);margin-top:1px}
.cmd-date{font-size:9.5px;font-weight:700;color:var(--royal);background:var(--royal-ghost);border:1px solid var(--royal-pale);padding:1px 7px;border-radius:var(--r-full);white-space:nowrap;flex-shrink:0}
.cmd-date.overdue{background:var(--s-red-bg);border-color:var(--s-red-b);color:var(--s-red)}
.cmd-none{font-size:12px;color:var(--t4);font-style:italic;padding:8px 0}
@media(max-width:900px){.cmd-center{grid-template-columns:1fr}}

/* ═══════════════════════════════════════════════
   ALERT BARS
═══════════════════════════════════════════════ */
.alerts{display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
.ab{display:flex;align-items:flex-start;gap:12px;padding:11px 15px;border-radius:var(--r-md);border:1px solid;border-left-width:4px;animation:fadeUp .3s ease}
.ab-red{background:var(--s-red-bg);border-color:var(--s-red-b);border-left-color:var(--s-red)}
.ab-yellow{background:var(--s-yellow-bg);border-color:var(--s-yellow-b);border-left-color:var(--s-yellow)}
.ab-green{background:var(--s-green-bg);border-color:var(--s-green-b);border-left-color:var(--s-green)}
.ab-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.ab-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.ab-red .ab-title{color:var(--s-red)} .ab-yellow .ab-title{color:var(--s-yellow)} .ab-green .ab-title{color:var(--s-green)}
.ab-body{font-size:12px;color:var(--t2);line-height:1.5}

/* ═══════════════════════════════════════════════
   PERSON BANNER
═══════════════════════════════════════════════ */
.person-banner{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--b1);border-radius:var(--r-lg);padding:12px 18px;margin-bottom:18px;box-shadow:var(--shadow-xs)}
.pb-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.pb-name{font-family:var(--ff-h);font-size:15px;font-weight:800;color:var(--navy)}
.pb-role{font-size:11.5px;color:var(--t3);margin-top:1px}
.pb-info{flex:1}
.pb-clear{font-size:12px;font-weight:600;color:var(--royal);background:var(--royal-ghost);border:1px solid var(--royal-pale);padding:6px 14px;border-radius:var(--r-full);cursor:pointer;transition:var(--ease)}
.pb-clear:hover{background:var(--royal-pale)}

/* ═══════════════════════════════════════════════
   VIEW CONTAINERS
═══════════════════════════════════════════════ */
.view{display:none}
.view.active{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ═══════════════════════════════════════════════
   SECTION HEADER
═══════════════════════════════════════════════ */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.sec-title{font-family:var(--ff-h);font-size:17px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px}
.sec-pill{font-size:11px;font-weight:700;background:var(--royal-ghost);color:var(--royal);border:1px solid var(--royal-pale);padding:3px 10px;border-radius:var(--r-full)}

/* nav controls */
.nav-ctrl{display:flex;align-items:center;gap:8px}
.nav-btn{width:30px;height:30px;border-radius:var(--r-sm);border:1px solid var(--b1);background:var(--white);color:var(--t2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--ease);box-shadow:var(--shadow-xs)}
.nav-btn:hover{background:var(--royal-ghost);border-color:var(--royal-pale);color:var(--royal)}
.nav-lbl{font-family:var(--ff-h);font-size:14px;font-weight:700;color:var(--navy);min-width:150px;text-align:center}

/* ═══════════════════════════════════════════════
   MONTH VIEW
═══════════════════════════════════════════════ */
.cal-wrap{background:var(--white);border-radius:var(--r-xl);border:1px solid var(--b1);box-shadow:var(--shadow-md);overflow:hidden}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);background:var(--navy)}
.cal-dow{padding:11px 8px;text-align:center;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.55)}
.cal-dow.wd{color:rgba(255,255,255,.9)}
.cal-weeks{display:flex;flex-direction:column}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--b1)}
.cal-week:last-child{border-bottom:none}

.cc{min-height:108px;padding:7px 8px;border-right:1px solid var(--b1);cursor:pointer;transition:background var(--ease);vertical-align:top}
.cc:last-child{border-right:none}
.cc.outside{background:var(--silver-ghost);cursor:default}
.cc.wkend{background:#fafbfd;cursor:default}
.cc.us-hol{background:#fff9f0;}
.cc.active-day{background:var(--royal-ghost)}
.cc.today-cell{background:#e8f3fb}
.cc.has-tasks:hover{background:var(--royal-ghost)}
.cc.pay-urg{background:#fef3f2}
.cc.pay-yel{background:#fffbf0}
.cc.pay-grn{background:#f0faf5}
.cc.milestone{background:#f5f0fd}

.cc-num{font-family:var(--ff-h);font-size:12.5px;font-weight:700;color:var(--t3);line-height:1;margin-bottom:5px;display:flex;align-items:center;gap:4px}
.cc.outside .cc-num{color:var(--t4)}
.cc.today-cell .cc-num{color:var(--royal)}
.cc.wkend .cc-num{color:var(--silver-dark)}
.cc-bd{display:inline-block;font-size:8px;font-weight:800;background:var(--royal);color:#fff;padding:1px 5px;border-radius:3px}

.cc-chips{display:flex;flex-direction:column;gap:2px}
.chip{display:flex;align-items:flex-start;gap:3px;font-size:10px;font-weight:500;padding:2px 5px;border-radius:4px;line-height:1.3;cursor:pointer}
.chip:hover{filter:brightness(.94)}
.chip-i{font-size:9px;flex-shrink:0;margin-top:.5px}
.chip-t{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ch-pay-r{background:#fde8e6;color:#7a1810} .ch-pay-y{background:#fdf5e4;color:#7a5000}
.ch-pay-g{background:#e4f5ef;color:#0a5030} .ch-mile{background:#eee8fb;color:#3a1880}
.ch-hei{background:#e4f0fa;color:#003060}   .ch-har{background:#e4f0e8;color:#063020}
.ch-gen{background:#eef2f8;color:#2a4060}   .ch-el{background:#fdf5e4;color:#6a4800}
.ch-nik{background:#f0ebfb;color:#3a1880}   .ch-hol{background:#fff5f0;color:#804000;font-style:italic}
.cc-more{font-size:9px;font-weight:600;color:var(--royal);margin-top:2px;padding:1px 4px}

/* ═══════════════════════════════════════════════
   WEEK VIEW
═══════════════════════════════════════════════ */
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.wc{background:var(--white);border:1px solid var(--b1);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:var(--ease)}
.wc:hover{box-shadow:var(--shadow-md)}
.wc.wc-today{border-color:var(--royal);box-shadow:0 0 0 2px rgba(0,83,140,.12),var(--shadow-sm)}
.wc.wc-pay-r{border-top:3px solid var(--s-red)}
.wc.wc-pay-y{border-top:3px solid var(--s-yellow)}
.wc.wc-pay-g{border-top:3px solid var(--s-green)}
.wc.wc-mile{border-top:3px solid var(--s-purple)}
.wch{padding:11px 13px 9px;border-bottom:1px solid var(--b1);background:var(--silver-ghost)}
.wch.today-h{background:var(--royal-ghost)}
.wch-dow{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:2px}
.wch.today-h .wch-dow{color:var(--royal)}
.wch-date{font-family:var(--ff-h);font-size:21px;font-weight:800;color:var(--navy);line-height:1}
.wch.today-h .wch-date{color:var(--royal)}
.wch-bd{display:inline-block;margin-top:4px;font-size:9px;font-weight:700;background:var(--navy);color:#fff;padding:2px 7px;border-radius:var(--r-full)}
.wch-hol{font-size:9.5px;color:var(--s-yellow);font-weight:600;padding:4px 13px;border-bottom:1px solid var(--b1)}
.wcb{padding:9px 10px 12px;display:flex;flex-direction:column;gap:6px}

.wt{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid transparent;transition:var(--ease);cursor:pointer}
.wt:hover{transform:translateX(2px)}
.wt-urg{background:var(--s-red-bg);border-color:var(--s-red-b)}
.wt-high{background:var(--s-yellow-bg);border-color:var(--s-yellow-b)}
.wt-info{background:var(--royal-ghost);border-color:var(--royal-pale)}
.wt-gold{background:#fffaec;border-color:#f0d888}
.wt-pur{background:var(--s-purple-bg);border-color:var(--s-purple-b)}
.wt-grn{background:var(--s-green-bg);border-color:var(--s-green-b)}
.wt-norm{background:var(--silver-ghost);border-color:var(--b1)}
.wt-icon{font-size:13px;flex-shrink:0;margin-top:1px}
.wt-lbl{font-size:11px;font-weight:600;color:var(--t1);line-height:1.35}
.wt-who{font-size:9.5px;font-weight:600;color:var(--t3);margin-top:1px}
.no-task{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 12px;gap:5px;color:var(--t4);font-size:12px;text-align:center}
.no-task-i{font-size:22px;opacity:.3}

/* ═══════════════════════════════════════════════
   DAY VIEW
═══════════════════════════════════════════════ */
.day-strip-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.day-pill{display:flex;flex-direction:column;align-items:center;padding:9px 14px;border-radius:var(--r-md);border:1px solid var(--b1);background:var(--white);cursor:pointer;transition:var(--ease);min-width:64px;box-shadow:var(--shadow-xs)}
.day-pill:hover{border-color:var(--royal-pale);background:var(--royal-ghost)}
.day-pill.active{background:var(--navy);border-color:var(--navy);box-shadow:var(--shadow-md)}
.dp-dow{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3)}
.dp-num{font-family:var(--ff-h);font-size:19px;font-weight:800;color:var(--navy);line-height:1}
.dp-mon{font-size:9px;color:var(--t4);text-transform:uppercase;letter-spacing:1px}
.day-pill.active .dp-dow,.day-pill.active .dp-mon{color:rgba(255,255,255,.5)}
.day-pill.active .dp-num{color:#fff}
.dp-badge{margin-top:4px;font-size:8px;font-weight:700;padding:1.5px 6px;border-radius:var(--r-full);text-transform:uppercase;letter-spacing:.5px}
.dpb-pay{background:rgba(168,32,16,.12);color:var(--s-red)}
.dpb-mile{background:rgba(90,48,160,.12);color:var(--s-purple)}
.dpb-bd{background:rgba(0,83,140,.1);color:var(--royal)}
.day-pill.active .dp-badge{background:rgba(255,255,255,.15);color:#fff}

.dday-hdr{background:var(--white);border:1px solid var(--b1);border-radius:var(--r-xl);padding:22px 26px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;box-shadow:var(--shadow-sm)}
.dday-title{font-family:var(--ff-h);font-size:21px;font-weight:800;color:var(--navy);letter-spacing:-.2px}
.dday-sub{font-size:12px;color:var(--t3);margin-top:3px}
.dday-pills{display:flex;gap:7px;flex-wrap:wrap}
.dday-pill{font-size:11px;font-weight:600;padding:4px 12px;border-radius:var(--r-full);border:1px solid var(--b1);color:var(--t2);background:var(--silver-ghost)}
.dday-pill.royal{background:var(--royal-ghost);color:var(--royal);border-color:var(--royal-pale)}

.day-person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcol{background:var(--white);border:1px solid var(--b1);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:var(--ease)}
.pcol:hover{box-shadow:var(--shadow-md)}
.pcol-hd{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--b1);position:relative;overflow:hidden}
.pcol-hd::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.035}
.pcol-hd.h-ricky::after{background:linear-gradient(135deg,#c49020,transparent 70%)}
.pcol-hd.h-hardik::after{background:linear-gradient(135deg,var(--royal),transparent 70%)}
.pcol-hd.h-eldine::after{background:linear-gradient(135deg,#0d8060,transparent 70%)}
.pcol-hd.h-nik::after{background:linear-gradient(135deg,var(--s-purple),transparent 70%)}
.pcol-hd.h-events::after{background:linear-gradient(135deg,var(--s-red),transparent 70%)}
.pcol-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.pcol-info{flex:1}
.pcol-name{font-size:13.5px;font-weight:700;color:var(--navy)}
.pcol-role{font-size:10px;color:var(--t3);margin-top:1px}
.pcol-cnt{font-size:10.5px;font-weight:700;background:var(--silver-ghost);border:1px solid var(--b1);color:var(--t3);padding:2px 8px;border-radius:var(--r-full)}
.pcol-body{padding:11px 13px 14px}
.task-list{display:flex;flex-direction:column;gap:7px}

.ti{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:var(--r-md);border:1px solid transparent;transition:var(--ease)}
.ti:hover{transform:translateX(2px)}
.ti-urg{background:var(--s-red-bg);border-color:var(--s-red-b)}
.ti-high{background:var(--s-yellow-bg);border-color:var(--s-yellow-b)}
.ti-norm{background:var(--silver-ghost);border-color:var(--b1)}
.ti-info{background:var(--royal-ghost);border-color:var(--royal-pale)}
.ti-gold{background:#fffaec;border-color:#f0d888}
.ti-grn{background:var(--s-green-bg);border-color:var(--s-green-b)}
.ti-pur{background:var(--s-purple-bg);border-color:var(--s-purple-b)}
.ti-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.ti.is-due{border-left:3px solid var(--s-red);position:relative}
.ti.is-due::after{content:'DUE';position:absolute;top:6px;right:8px;font-size:8px;font-weight:800;letter-spacing:1px;background:var(--s-red);color:#fff;padding:1px 6px;border-radius:3px}
.due-flag{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;background:var(--s-red);color:#fff;padding:1.5px 7px;border-radius:3px;margin-left:5px;vertical-align:middle}
.ti-lbl{font-size:12px;font-weight:600;color:var(--t1);line-height:1.4;margin-bottom:2px}
.ti-det{font-size:11px;color:var(--t3);line-height:1.5}
.ti-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}

.tag{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:1px 5px;border-radius:3px}
.tag-heirloom{background:#ddeef8;color:#003060} .tag-harbor{background:#d8f0e0;color:#063020}
.tag-voh{background:#fde8d0;color:#7a3800}     .tag-mosquera{background:#eee8fb;color:#3a1880}
.tag-idt{background:#fde8e6;color:#7a1810}     .tag-buildai{background:#d4f5fa;color:#024858}
.tag-payroll{background:#fde8e6;color:#7a1810} .tag-turnkey{background:#eef2f8;color:#2a4060}
.tag-deadline{background:#fff3cc;color:#7a5000}.tag-review{background:#e0eef8;color:#003060}
.tag-milestone{background:#eee8fb;color:#3a1880}

.no-tasks-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 14px;gap:5px;color:var(--t4);font-size:12px;text-align:center}
.ntm-i{font-size:22px;opacity:.3}

/* ═══════════════════════════════════════════════
   MODAL
═══════════════════════════════════════════════ */
.overlay{position:fixed;inset:0;background:rgba(0,27,62,.5);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--white);border-radius:var(--r-xl);box-shadow:var(--shadow-xl);width:100%;max-width:660px;max-height:88vh;overflow-y:auto;transform:translateY(14px) scale(.98);transition:transform .25s cubic-bezier(.34,1.56,.64,1);border:1px solid var(--b1)}
.overlay.open .modal{transform:none}
.modal-hd{background:var(--navy);padding:20px 24px;display:flex;align-items:flex-start;justify-content:space-between}
.mh-t{font-family:var(--ff-h);font-size:17px;font-weight:800;color:#fff}
.mh-s{font-size:11px;color:rgba(184,196,202,.7);margin-top:3px}
.m-close{width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--ease);flex-shrink:0}
.m-close:hover{background:rgba(255,255,255,.22)}
.modal-bd{padding:18px 24px 26px}

/* ═══════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════ */
@media(max-width:900px){.stats-row{grid-template-columns:repeat(2,1fr)}.week-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.sidebar{width:200px}.main{margin-left:200px}.content{padding:18px 18px 40px}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--silver-mid);border-radius:3px}
</style>

    <div class="content">

    </div>
  </main>
</div>

// Pre-parse dates from ISO strings into Date objects
function parseEmbeddedData(raw) {
  const out = {};
  for (const [month, rows] of Object.entries(raw)) {
    out[month] = rows.map(r => ({
      ...r,
      date: r.date ? new Date(r.date + 'T12:00:00') : null,
      isBusinessDay: r.bdNum > 0,
      isWeekend: ['SAT','SUN'].includes(r.day),
    }));
  };
  return out;
}

function isDueLine(line, col) {
  const lc = line.toLowerCase();
  if (col === 'payroll' && (line.includes('CASH DUE') || line.includes('PAY DATE') || line.includes('💵'))) return true;
  if (lc.includes('close books') || lc.includes('★') || lc.includes('deadline') || lc.includes('due today') || lc.includes('due —') || lc.includes('must be') || lc.includes('deliver')) return true;
  if (line.includes('BD 5') || line.includes('BD 8') || line.includes('BD 9') || line.includes('BD 15')) return true;
  if (line.includes('🔴') && col === 'payroll') return true;
  return false;
}

function extractTasks(cellText, colKey) {
  if (!cellText) return [];
  const tasks = [];
  // Split on emoji-led lines or newline groups
  const lines = cellText.split(/\n/).map(l=>l.trim()).filter(Boolean);
  
  let current = null;
  for (const line of lines) {
    // Is this a new task line? (starts with emoji or [ or has [Person])
    const isNewTask = /^[\p{Emoji_Presentation}\p{Extended_Pictographic}]/u.test(line) || 
                      line.startsWith('[') || 
                      /^(BD|🟢|🟡|🔴|💵|✅|📥|📒|👁|📬|⚡|🔑|📊|📈|📤|📦|📣|🔧|🔁|⭐|💰|🏛|⚓|🕊|🧠|💼|🤖|🔑|📋|📌|🟢|🟡|🔴|💵)/.test(line);
    
    if (isNewTask || !current) {
      if (current) tasks.push(current);
      // Extract person tag like [Hardik] or [Ricky]
      const personMatch = line.match(/\[(Hardik|Ricky|Eldine|Nik|Ramp|All|Staff)\]/i);
      const person = personMatch ? personMatch[1].toLowerCase() : inferPerson(line, colKey);
      current = {
        icon: extractIcon(line),
        label: cleanLabel(line),
        detail: '',
        person,
        priority: inferPriority(line, colKey),
        tags: inferTags(line, colKey),
        col: colKey,
      };
    } else {
      // Continuation / detail line
      if (current.detail) current.detail += ' ' + line;
      else current.detail = line;
    }
  }
  if (current) tasks.push(current);
  return tasks;
}

function extractIcon(line) {
  const m = line.match(/^([\p{Emoji_Presentation}\p{Extended_Pictographic}🟢🟡🔴💵✅📥📒👁📬⚡🔑📊📈📤📦📣🔧🔁⭐💰📋📌])/u);
  return m ? m[1] : '•';
}

function cleanLabel(line) {
  // Remove leading icon and clean up
  return line.replace(/^[\p{Emoji_Presentation}\p{Extended_Pictographic}🟢🟡🔴💵✅📥📒👁📬⚡🔑📊📈📤📦📣🔧🔁⭐💰📋📌]\s*/u, '')
             .replace(/^\s+/, '').trim();
}

function inferPerson(line, col) {
  if (line.includes('[Hardik]') || line.includes('[Ramp]')) return 'hardik';
  if (line.includes('[Ricky]')) return 'ricky';
  if (line.includes('[Eldine]')) return 'eldine';
  if (line.includes('[Nik]')) return 'nik';
  if (col === 'eldine') return 'eldine';
  if (col === 'turnkeycfo') return 'ricky';
  if (col === 'payroll' || col === 'notes') return 'events';
  if (['harbor','voh','mosquera','idt','buildai'].includes(col)) return 'hardik';
  if (col === 'heirloom') return 'hardik'; // default heirloom to hardik unless Ricky tag
  return 'hardik';
}

function inferPriority(line, col) {
  if (col === 'payroll') {
    if (line.includes('🔴') || line.includes('CASH DUE') || line.includes('PAY DATE')) return 'urg';
    if (line.includes('🟡')) return 'high';
    if (line.includes('🟢')) return 'grn';
    return 'info';
  }
  if (line.includes('★') || line.includes('CLOSE') || line.includes('DUE') || line.includes('DEADLINE')) return 'urg';
  if (line.includes('[Ricky]') && (line.includes('deliver') || line.includes('send') || line.includes('share'))) return 'high';
  if (line.includes('⭐') || line.includes('BD 5') || line.includes('BD 8') || line.includes('BD 9')) return 'gold';
  if (col === 'notes') return 'gold';
  return 'norm';
}

function inferTags(line, col) {
  const tags = [];
  const lc = line.toLowerCase();
  if (col === 'heirloom' || lc.includes('heirloom')) tags.push('heirloom');
  if (col === 'harbor'   || lc.includes('harbor'))   tags.push('harbor');
  if (col === 'voh'      || lc.includes('village of hope') || lc.includes('voh')) tags.push('voh');
  if (col === 'mosquera' || lc.includes('mosquera')) tags.push('mosquera');
  if (col === 'idt'      || lc.includes('idt') || lc.includes('walt')) tags.push('idt');
  if (col === 'buildai'  || lc.includes('build ai')) tags.push('buildai');
  if (col === 'turnkeycfo'|| lc.includes('turnkeycfo')) tags.push('turnkey');
  if (col === 'payroll'  || lc.includes('payroll')) tags.push('payroll');
  if (lc.includes('deadline') || lc.includes('due') || lc.includes('today')) tags.push('deadline');
  return [...new Set(tags)];
}

/* ══════════════════════════════════════════════════════════
   BUILD PERSON TASK GROUPS FROM A ROW
══════════════════════════════════════════════════════════ */
function getTasksForRow(row) {
  const groups = { ricky:[], hardik:[], eldine:[], nik:[], events:[] };
  if (!row.isBusinessDay) return groups;

  const COL_MAP = {
    heirloom:'heirloom', harbor:'harbor', voh:'voh', mosquera:'mosquera',
    idt:'idt', buildai:'buildai', turnkeycfo:'turnkeycfo'
  };

  // Client columns → tasks with person routing
  for (const [col, key] of Object.entries(COL_MAP)) {
    const tasks = extractTasks(row[col], col);
    for (const t of tasks) {
      const p = t.person;
      if (p === 'ricky' && groups.ricky) groups.ricky.push(t);
      else groups.hardik.push(t);
    }
  }

  // Eldine column
  for (const t of extractTasks(row.eldine, 'eldine')) groups.eldine.push(t);

  // Eldine – personal finance: reconcile BD3, deliver BD6
  if (row.bdNum === 3) {
    groups.eldine.push({
      icon:'💳', label:"Begin Ricky's personal finance reconciliation",
      detail:"Reconcile Ricky's personal accounts for the month. Due to Ricky by BD 6.",
      person:'eldine', priority:'high', tags:['deadline'], col:'eldine',
      isDue: false
    });
  }
  if (row.bdNum === 6) {
    groups.eldine.push({
      icon:'🔴', label:"DELIVER personal finance report → Ricky",
      detail:"Deliver completed personal finance reconciliation to Ricky. DUE TODAY — BD 6.",
      person:'eldine', priority:'urg', tags:['deadline'], col:'eldine',
      isDue: true
    });
  }

  // Payroll → events
  for (const t of extractTasks(row.payroll, 'payroll')) {
    t.person = 'events';
    groups.events.push(t);
    // Also add payroll urgency to Ricky
    if (['urg','high'].includes(t.priority)) {
      groups.ricky.push({...t, person:'ricky', col:'payroll'});
    }
  }

  // Notes → events
  for (const t of extractTasks(row.notes, 'notes')) {
    t.person = 'events';
    groups.events.push(t);
  }

  // Nik tasks: scan heirloom for [Nik] lines
  const nikTasks = (groups.hardik||[]).filter(t => t.label.includes('[Nik]') || t.label.toLowerCase().includes('nik'));
  for (const t of nikTasks) { t.person = 'nik'; groups.nik.push(t); }
  // Remove from hardik
  groups.hardik = groups.hardik.filter(t => t.person !== 'nik');
  // Similarly for Ricky tasks in hardik
  const rickyFromHardik = groups.hardik.filter(t => t.label.includes('[Ricky]'));
  for (const t of rickyFromHardik) { t.person = 'ricky'; groups.ricky.push(t); }
  groups.hardik = groups.hardik.filter(t => !t.label.includes('[Ricky]'));

  return groups;
}

/* ══════════════════════════════════════════════════════════
   FILTER TASKS BY PERSON
══════════════════════════════════════════════════════════ */
function filterByPerson(groups) {
  if (currentPerson === 'all') {
    const all = [];
    const LABELS = {ricky:'Ricky',hardik:'Hardik',eldine:'Eldine',nik:'Nik',events:'Deadlines'};
    for (const [k,arr] of Object.entries(groups)) {
      for (const t of arr) all.push({...t, _who: LABELS[k]||k});
    }
    return {all};
  }
  return {[currentPerson]: groups[currentPerson]||[]};
}

/* ══════════════════════════════════════════════════════════
   GET ROWS FOR CURRENT WINDOW
══════════════════════════════════════════════════════════ */
function getCurrentMonthRows() {
  return calData[MONTH_KEYS[currentMonthIdx]] || [];
}

function getWeekRows() {
  if (!currentWeekStart) return [];
  const rows = [];
  for (const monthName of MONTH_KEYS) {
    for (const r of (calData[monthName]||[])) {
      if (!r.date) continue;
      const d = new Date(r.date);
      const diff = (d - currentWeekStart) / 86400000;
      if (diff >= 0 && diff < 7 && !['SAT','SUN'].includes(r.day)) rows.push(r);
    }
  }
  return rows.slice(0,5);
}

function get5BusinessDays() {
  // Starting from current5Days anchor
  return current5Days;
}

function findRowByDate(dateObj) {
  if (!dateObj) return null;
  const iso = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  for (const mn of MONTH_KEYS) {
    for (const r of (calData[mn]||[])) {
      if (r.date && iso(r.date) === iso(dateObj)) return r;
    }
  }
  return null;
}

/* ══════════════════════════════════════════════════════════
   PAYROLL CELL COLOR
══════════════════════════════════════════════════════════ */
function getPayrollClass(row) {
  const p = row.payroll||'';
  if (p.includes('🔴')) return 'pay-urg';
  if (p.includes('🟡')) return 'pay-yel';
  if (p.includes('🟢')) return 'pay-grn';
  return '';
}

function isMilestoneRow(row) {
  return [5,8,9,15].includes(row.bdNum);
}

/* ══════════════════════════════════════════════════════════
   RENDER HELPERS
══════════════════════════════════════════════════════════ */
const PCLS = {urg:'ti-urg',high:'ti-high',norm:'ti-norm',info:'ti-info',gold:'ti-gold',grn:'ti-grn',pur:'ti-pur'};
const WPCLS = {urg:'wt-urg',high:'wt-high',norm:'wt-norm',info:'wt-info',gold:'wt-gold',grn:'wt-grn',pur:'wt-pur'};

function tagHTML(tags) {
  return (tags||[]).map(t=>`<span class="tag tag-${t}">${t.toUpperCase()}</span>`).join('');
}

function taskItemHTML(t, showWho=false) {
  const pcls = PCLS[t.priority]||'ti-norm';
  const dueCls = t.isDue ? ' is-due' : '';
  const dueBadge = t.isDue ? '<span class="due-flag">⚑ DUE</span>' : '';
  const who = showWho && t._who ? `<div style="font-size:10px;font-weight:700;color:var(--royal);margin-bottom:2px">${t._who}</div>` : '';
  return `<div class="ti ${pcls}${dueCls}">
    <div class="ti-icon">${t.icon||'•'}</div>
    <div class="ti-body">
      ${who}
      <div class="ti-lbl">${escH(t.label)}${dueBadge}</div>
      ${t.detail?`<div class="ti-det">${escH(t.detail)}</div>`:''}
      ${t.tags?.length?`<div class="ti-tags">${tagHTML(t.tags)}</div>`:''}
    </div>
  </div>`;
}

function escH(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function cellChipsHTML(row) {
  const groups = getTasksForRow(row);
  const filtered = filterByPerson(groups);
  const all = Object.values(filtered).flat();
  if (!all.length) return '';

  const chips = all.slice(0,3).map(t => {
    let cls = 'ch-gen';
    const p = row.payroll||'';
    if (t.col==='payroll'){ cls = t.icon==='🔴'?'ch-pay-r': t.icon==='🟡'?'ch-pay-y':'ch-pay-g'; }
    else if (t.col==='heirloom') cls='ch-hei';
    else if (t.col==='harbor'||t.col==='buildai') cls='ch-har';
    else if (t.col==='voh'||t.col==='mosquera') cls='ch-gen';
    else if (t.col==='eldine') cls='ch-el';
    else if (t.col==='notes') cls='ch-mile';
    if (row.bdNum===5||row.bdNum===8||row.bdNum===9||row.bdNum===15) cls='ch-mile';
    return `<div class="chip ${cls}"><span class="chip-i">${t.icon||'•'}</span><span class="chip-t">${escH(t.label)}</span></div>`;
  }).join('');
  const more = all.length - 3;
  return chips + (more>0?`<div class="cc-more">+${more} more</div>`:'');
}

/* ══════════════════════════════════════════════════════════
   RENDER: MONTH VIEW
══════════════════════════════════════════════════════════ */
function renderMonth() {
  const monthName = MONTH_KEYS[currentMonthIdx];
  const monthNum  = MONTH_NUMS[monthName]; // 0-indexed
  document.getElementById('mvLbl').textContent = `${monthName} 2026`;
  document.getElementById('mvTitle').textContent = 'Monthly Calendar';
  document.getElementById('mvPill').textContent = `${monthName} 2026`;

  const rows = calData[monthName]||[];
  if (!rows.length) { document.getElementById('calWeeks').innerHTML='<div style="padding:20px;color:var(--t3)">No data for this month.</div>'; return; }

  // Build date→row map
  const rowMap = new Map();
  for (const r of rows) {
    if (r.date) rowMap.set(`${r.date.getFullYear()}-${r.date.getMonth()}-${r.date.getDate()}`, r);
  }

  // Build calendar grid
  const firstDay = new Date(2026, monthNum, 1);
  const lastDay  = new Date(2026, monthNum+1, 0);
  const today = new Date();
  const todayKey = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;

  // Start on Monday
  let cur = new Date(firstDay);
  while (cur.getDay() !== 1) cur = new Date(cur.getTime() - 86400000);

  let html = '';
  let safetyCount = 0;
  while (cur <= lastDay || cur.getDay() !== 1) {
    if (safetyCount++ > 10) break;
    html += '<div class="cal-week">';
    for (let i = 0; i < 7; i++) {
      const d = new Date(cur.getTime() + i*86400000);
      const dKey = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      const outside = d.getMonth() !== monthNum;
      const isWeekend = d.getDay()===0||d.getDay()===6;
      const row = rowMap.get(dKey);
      const isToday = dKey === todayKey;

      let ccls = 'cc';
      if (outside) ccls += ' outside';
      else if (row && row.holidays && row.holidays.includes('🇺🇸')) ccls += ' us-hol';
      else if (isWeekend) ccls += ' wkend';
      else if (isToday) ccls += ' today-cell';

      if (!outside && !isWeekend && row) {
        const pc = getPayrollClass(row);
        if (pc) ccls += ' ' + pc;
        else if (isMilestoneRow(row)) ccls += ' milestone';
        else if (row.isBusinessDay) ccls += ' has-tasks';
      }

      const canClick = !outside && row && row.isBusinessDay;
      const clickAttr = canClick ? `onclick="openModal('${dKey}')"` : '';

      let inner = '';
      if (outside) {
        inner = `<div class="cc-num" style="color:var(--t4)">${d.getDate()}</div>`;
      } else {
        const bdLabel = row && row.bdNum ? `<span class="cc-bd">BD${row.bdNum}</span>` : '';
        const holFlags = row && row.holidays && !row.holidays.includes('🇺🇸')
          ? `<div style="font-size:9.5px;color:var(--s-yellow);font-weight:600;line-height:1.3;margin-bottom:3px">${escH(row.holidays.replace(/[\n]/g,' · '))}</div>` : '';
        const usHolLabel = row && row.holidays && row.holidays.includes('🇺🇸')
          ? `<div class="chip ch-hol" style="margin-bottom:2px"><span class="chip-i">🇺🇸</span><span class="chip-t">${escH(row.holidays.split('\n')[0])}</span></div>` : '';
        const chips = (canClick && row) ? cellChipsHTML(row) : '';
        inner = `<div class="cc-num">${d.getDate()} ${bdLabel}</div>${holFlags}<div class="cc-chips">${usHolLabel}${chips}</div>`;
      }

      html += `<div class="${ccls}" ${clickAttr}>${inner}</div>`;
    }
    html += '</div>';
    cur = new Date(cur.getTime() + 7*86400000);
    if (cur > lastDay && cur.getDay() === 1) break;
  }
  document.getElementById('calWeeks').innerHTML = html;
}

/* ══════════════════════════════════════════════════════════
   RENDER: WEEK VIEW
══════════════════════════════════════════════════════════ */
function renderWeek() {
  const wRows = getWeekRows();
  if (!wRows.length) {
    // Try to set weekStart from current month
    const rows = calData[MONTH_KEYS[currentMonthIdx]]||[];
    const firstBD = rows.find(r=>r.isBusinessDay && r.date);
    if (firstBD) { currentWeekStart = new Date(firstBD.date); while(currentWeekStart.getDay()!==1) currentWeekStart = new Date(currentWeekStart.getTime()-86400000); }
  }
  const wRowsFinal = getWeekRows();

  const s = wRowsFinal[0], e = wRowsFinal[wRowsFinal.length-1];
  if (s && e) {
    const fmt = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    document.getElementById('wvLbl').textContent = `${fmt(s.date)} – ${fmt(e.date)}, 2026`;
  }

  const today = new Date();
  const todayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

  let html = '';
  for (const row of wRowsFinal) {
    const isToday = row.date && todayKey(row.date) === todayKey(today);
    const pcls = getPayrollClass(row);
    const isMile = isMilestoneRow(row);

    let wcls = 'wc';
    if (isToday) wcls += ' wc-today';
    if (pcls==='pay-urg') wcls += ' wc-pay-r';
    else if (pcls==='pay-yel') wcls += ' wc-pay-y';
    else if (pcls==='pay-grn') wcls += ' wc-pay-g';
    else if (isMile) wcls += ' wc-mile';

    const headCls = isToday ? 'wch today-h' : 'wch';
    const dayNum = row.date ? row.date.getDate() : '';
    const dow = row.day.slice(0,3);
    const bdBadge = row.bdNum ? `<div class="wch-bd">BD ${row.bdNum}</div>` : '';
    const holHtml = (row.holidays && !row.holidays.includes('🇺🇸') && row.holidays.trim())
      ? `<div class="wch-hol">${escH(row.holidays.replace(/\n/g,' · '))}</div>` : '';
    const usHol = row.holidays && row.holidays.includes('🇺🇸');

    const groups = getTasksForRow(row);
    const filtered = filterByPerson(groups);
    const allTasks = Object.values(filtered).flat();

    const usHolBanner = usHol ? `<div class="wt wt-high" style="margin-bottom:2px"><div class="wt-icon">🇺🇸</div><div class="wt-content"><div class="wt-lbl">${escH(row.holidays.split('\n')[0])}</div><div class="wt-who">Holiday — work continues per schedule</div></div></div>` : '';
    const workHtml = allTasks.length === 0
        ? `<div class="no-task"><div class="no-task-i">☑</div><div>Clear day</div></div>`
        : allTasks.map(t => {
            const wcls2 = WPCLS[t.priority]||'wt-norm';
            return `<div class="wt ${wcls2}"><div class="wt-icon">${t.icon||'•'}</div><div class="wt-content"><div class="wt-lbl">${escH(t.label)}</div><div class="wt-who">${t._who||''}</div></div></div>`;
          }).join('');
    const tasksHtml = usHolBanner + workHtml;

    html += `<div class="${wcls}">
      <div class="${headCls}">
        <div class="wch-dow">${dow}</div>
        <div class="wch-date">${dayNum}</div>
        ${bdBadge}
      </div>
      ${holHtml}
      <div class="wcb">${tasksHtml}</div>
    </div>`;
  }
  document.getElementById('weekGrid').innerHTML = html || '<div style="padding:20px;color:var(--t3)">No data for this week.</div>';
}

/* ══════════════════════════════════════════════════════════
   RENDER: DAY VIEW
══════════════════════════════════════════════════════════ */
function renderDay() {
  const days = get5BusinessDays();
  const today = new Date();
  const todayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

  let stripHtml = '';
  for (let i = 0; i < days.length; i++) {
    const row = days[i];
    if (!row) continue;
    const d = row.date || new Date();
    const evts = row.payroll||'';
    const hasPay = evts.includes('🔴')||evts.includes('💵');
    const isMile = isMilestoneRow(row);
    const dow = row.day.slice(0,3);
    const mn = d.toLocaleDateString('en-US',{month:'short'}).toUpperCase();

    let badge = '';
    if (hasPay) badge=`<span class="dp-badge dpb-pay">Payroll</span>`;
    else if (isMile) badge=`<span class="dp-badge dpb-mile">Milestone</span>`;
    else if (row.bdNum) badge=`<span class="dp-badge dpb-bd">BD ${row.bdNum}</span>`;

    stripHtml += `<div class="day-pill ${i===currentDayIdx?'active':''}" onclick="selectDay(${i})">
      <div class="dp-dow">${dow}</div>
      <div class="dp-num">${d.getDate()}</div>
      <div class="dp-mon">${mn}</div>

  document.getElementById('dayStrip').innerHTML = `
    <button class="nav-btn" onclick="shiftDays(-1)">‹</button>
    ${stripHtml}
    <button class="nav-btn" onclick="shiftDays(1)">›</button>`;
  renderDayDetail();
}

  if (!row) return;

  const d = row.date || new Date();
  const fullDate = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  const groups = getTasksForRow(row);

  // Decide which persons to show
  const showPeople = currentPerson === 'all'
    ? PEOPLE.filter(p => p.key !== 'all')

  const totalFiltered = currentPerson === 'all'
    ? Object.values(groups).flat().length

      </div>
      <div class="pcol-body">${bodyHtml}</div>
    </div>`;

  document.getElementById('dayDetailEl').innerHTML = `
    <div class="dday-hdr">
      <div>
        <div class="dday-title">${fullDate}</div>
        <div class="dday-sub">${row.bdNum?`Business Day ${row.bdNum} of ${MONTH_KEYS[currentMonthIdx]} 2026`:''}</div>
      </div>
      <div class="dday-pills">
        <div class="dday-pill">📋 ${totalFiltered} tasks</div>
        ${bdPill}
      </div>
    </div>
    ${holHtml}
    <div class="day-person-grid">${colsHtml || '<div style="color:var(--t3);padding:20px">No tasks for this person today.</div>'}</div>`;
}

/* ══════════════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════════════ */
function openModal(dKey) {
  // Find row by dKey format "year-month0indexed-day"
  let row = null;
  for (const mn of MONTH_KEYS) {
    for (const r of (calData[mn]||[])) {
      if (!r.date) continue;
      const k = `${r.date.getFullYear()}-${r.date.getMonth()}-${r.date.getDate()}`;
      if (k === dKey) { row = r; break; }
    }
    if (row) break;
  }
  if (!row) return;

  const d = row.date;
  const fullDate = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('mhTitle').textContent = fullDate;
  document.getElementById('mhSub').textContent = `${row.bdNum?`Business Day ${row.bdNum}`:''}${row.holidays?' · '+row.holidays.replace(/\n/g,' · '):''}`;

  const groups = getTasksForRow(row);
  const LABELS = {ricky:'👤 Ricky',hardik:'👤 Hardik',eldine:'👤 Eldine',nik:'👤 Nik',events:'🔴 Deadlines'};

  let bodyHtml = '';
  for (const [k,arr] of Object.entries(groups)) {
    if (!arr.length) continue;
    if (currentPerson !== 'all' && k !== currentPerson) continue;
    bodyHtml += `<div style="margin-bottom:16px">
      <div style="font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:7px">${LABELS[k]||k}</div>
      <div class="task-list">${arr.map(t=>taskItemHTML(t)).join('')}</div>
    </div>`;
  }
  document.getElementById('modalBody').innerHTML = bodyHtml || `<div class="no-tasks-msg"><div class="ntm-i">🗓</div><div>No tasks this day.</div></div>`;
  document.getElementById('overlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('overlay') || !e.target) {
    document.getElementById('overlay').classList.remove('open');
  }
}

  { days: 'BD 1 (start of month)', client: 'Walt / IDT', activity: 'Independent management as needed' },
  { days: 'Mid-month BD (≈15th)', client: 'Harbor + Build AI', activity: 'Mid-month categorization & flag unknowns' },
  { days: 'Last week Mon (pre-close)', client: 'Heirloom', activity: 'Pre-close categorization begins' },
  { days: 'BD 2–5 (first week)', client: 'Heirloom', activity: 'First-week close — finalize categorization' },
];
function updateStats() {
  // ── gather rows for the current window ───────────────────────────────────
  let rows = [];
  if (currentView==='month') rows = (calData[MONTH_KEYS[currentMonthIdx]]||[]).filter(r=>r.isBusinessDay);
  else if (currentView==='week') rows = getWeekRows();
  else rows = get5BusinessDays();

  const fmtD = d => d ? d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';

  // ── PANEL 1: Upcoming Deadlines ───────────────────────────────────────────
  // Scan ALL months for deadlines after today within next 45 days
  const today = new Date(); today.setHours(0,0,0,0);
  const horizon = new Date(today); horizon.setDate(horizon.getDate()+45);
  const allRows = [];
  for (const mn of MONTH_KEYS) for (const r of (calData[mn]||[])) if (r.isBusinessDay && r.date) allRows.push(r);

  const deadlines = [];
  for (const row of allRows) {
    const d = new Date(row.date); d.setHours(0,0,0,0);
    if (d < today || d > horizon) continue;
    // Payroll due
    const p = row.payroll||'';
    if (p.includes('CASH DUE FOR PAYROLL')) deadlines.push({date:row.date, label:'Heirloom Payroll — Cash Due', dot:'cd-red', urgency:0});
    if (p.includes('💵 HEIRLOOM PAYROLL PAY DATE')) deadlines.push({date:row.date, label:'Heirloom Pay Date', dot:'cd-navy', urgency:1});
    // BD milestones
    if (row.bdNum===5)  deadlines.push({date:row.date, label:'Heirloom Books Close (BD 5)', dot:'cd-red', urgency:0});
    if (row.bdNum===8)  deadlines.push({date:row.date, label:'Client Financial Delivery (BD 8)', dot:'cd-red', urgency:0});
    if (row.bdNum===9)  deadlines.push({date:row.date, label:'Budget vs. Actuals Due — Ricky (BD 9)', dot:'cd-yellow', urgency:1});
    if (row.bdNum===15) deadlines.push({date:row.date, label:'BvA → Dakota (BD 15)', dot:'cd-royal', urgency:2});
    if (row.bdNum===6)  deadlines.push({date:row.date, label:"Ricky Personal Finance Delivered — Eldine (BD 6)", dot:'cd-yellow', urgency:1});
  }
  deadlines.sort((a,b)=>(new Date(a.date)-new Date(b.date))||a.urgency-b.urgency);
  const uniqueDL = []; const dlSeen = new Set();
  for (const dl of deadlines) { const k=`${dl.label}-${fmtD(dl.date)}`; if(!dlSeen.has(k)){dlSeen.add(k);uniqueDL.push(dl);} }

  const dlHTML = uniqueDL.slice(0,6).map(dl => {
    const isPast = new Date(dl.date) < today;
    const dStr = fmtD(dl.date);
    return `<div class="cmd-item">
      <div class="cmd-dot ${dl.dot}"></div>
      <div class="cmd-item-body">
        <div class="cmd-item-label">${escH(dl.label)}</div>
      </div>
      <div class="cmd-date ${isPast?'overdue':''}">${dStr}</div>
    </div>`;
  }).join('') || `<div class="cmd-none">No upcoming deadlines in next 45 days.</div>`;

  // ── PANEL 2: Payroll Calendar ─────────────────────────────────────────────
  const payrollRows = allRows.filter(r => {
    const d = new Date(r.date); d.setHours(0,0,0,0);
    const p = r.payroll||'';
    return d >= today && (p.includes('💵') || p.includes('🔴 CASH DUE') || p.includes('🟢') || p.includes('🟡') || p.includes('🔴 PAYROLL CASH'));
  }).slice(0,5);

  const prHTML = payrollRows.map(row => {
    const p = row.payroll||'';
    let dot='cd-silver', lbl='Payroll Reminder';
    if (p.includes('💵')) { dot='cd-navy'; lbl='Pay Date'; }
    else if (p.includes('CASH DUE FOR')) { dot='cd-red'; lbl='Cash Due — Fund Account'; }
    else if (p.includes('🔴 PAYROLL CASH')) { dot='cd-red'; lbl='Cash Due Tomorrow'; }
    else if (p.includes('🟡')) { dot='cd-yellow'; lbl='Cash Reminder (2 days)'; }
    else if (p.includes('🟢')) { dot='cd-green'; lbl='Cash Reminder (3 days)'; }
    return `<div class="cmd-item">
      <div class="cmd-dot ${dot}"></div>
      <div class="cmd-item-body"><div class="cmd-item-label">${lbl}</div><div class="cmd-item-sub">Heirloom · [Ricky]</div></div>
      <div class="cmd-date">${fmtD(row.date)}</div>
    </div>`;
  }).join('') || `<div class="cmd-none">No upcoming payroll events.</div>`;

  // ── PANEL 3: Hardik's Client Batching Schedule ────────────────────────────
  const batchHTML = HARDIK_SCHEDULE.map(s =>
    `<div class="cmd-item">
      <div class="cmd-dot cd-royal"></div>
      <div class="cmd-item-body">
        <div class="cmd-item-label">${escH(s.client)}</div>
        <div class="cmd-item-sub">${escH(s.activity)}</div>
      </div>
      <div class="cmd-date">${escH(s.days)}</div>
    </div>`
  ).join('');

  // ── PANEL 4: Alerts ───────────────────────────────────────────────────────
  const alerts = [];
  for (const row of rows) {
    const p = row.payroll||'', dateStr = fmtD(row.date);
    if (p.includes('CASH DUE FOR PAYROLL TODAY') || p.includes('🔴 CASH DUE'))
      alerts.push({cls:'ab-red',icon:'🚨',title:`Cash Due — ${dateStr}`,body:'Heirloom payroll funds must be in the account by EOD today.'});
    if (p.includes('TOMORROW'))
      alerts.push({cls:'ab-yellow',icon:'⚠️',title:'Payroll Cash Due Tomorrow',body:'Final reminder: fund Heirloom payroll account today.'});
    if (p.includes('🟢 PAYROLL CASH REMINDER'))
      alerts.push({cls:'ab-green',icon:'🟢',title:`Payroll Cash Reminder — ${dateStr}`,body:'Begin staging funds for upcoming Heirloom payroll.'});
  }
  const seen = new Set();
  const uniqAlerts = alerts.filter(a=>{ if(seen.has(a.title))return false; seen.add(a.title); return true; });
  document.getElementById('alertsEl').innerHTML = uniqAlerts.slice(0,3).map(a=>
    `<div class="ab ${a.cls}"><div class="ab-icon">${a.icon}</div><div><div class="ab-title">${a.title}</div><div class="ab-body">${a.body}</div></div></div>`
  ).join('');

  // ── Render command center ─────────────────────────────────────────────────
  document.getElementById('cmdCenter').innerHTML = `
    <div class="cmd-panel cp-royal">
      <div class="cmd-hdr"><span class="cmd-hdr-icon">🔴</span> Upcoming Deadlines <span style="margin-left:auto;font-size:9px;color:var(--t4);text-transform:none;font-weight:400">Next 45 days</span></div>
      ${dlHTML}
    </div>
    <div class="cmd-panel cp-navy">
      <div class="cmd-hdr"><span class="cmd-hdr-icon">💵</span> Payroll Calendar <span style="margin-left:auto;font-size:9px;color:var(--t4);text-transform:none;font-weight:400">Heirloom · upcoming</span></div>
      ${prHTML}
    </div>
    <div class="cmd-panel cp-royal">
      <div class="cmd-hdr"><span class="cmd-hdr-icon">📅</span> Hardik's Client Schedule <span style="margin-left:auto;font-size:9px;color:var(--t4);text-transform:none;font-weight:400">Batching cadence</span></div>
      ${batchHTML}
    </div>
    <div class="cmd-panel cp-navy">
      <div class="cmd-hdr"><span class="cmd-hdr-icon">🎨</span> Color &amp; Badge Legend</div>
      <div class="cmd-item"><div class="cmd-dot cd-red"></div><div class="cmd-item-body"><div class="cmd-item-label">Red dot / 🔴 / red border</div><div class="cmd-item-sub">Hard deadline — item is DUE, must be completed</div></div></div>
      <div class="cmd-item"><div class="cmd-dot cd-yellow"></div><div class="cmd-item-body"><div class="cmd-item-label">Yellow / amber</div><div class="cmd-item-sub">High priority — action required soon (payroll 2-day warning)</div></div></div>
      <div class="cmd-item"><div class="cmd-dot cd-green"></div><div class="cmd-item-body"><div class="cmd-item-label">Green</div><div class="cmd-item-sub">Early reminder — begin staging / preparing (payroll 3-day)</div></div></div>
      <div class="cmd-item"><div class="cmd-dot cd-royal"></div><div class="cmd-item-body"><div class="cmd-item-label">Royal Blue cell / chip</div><div class="cmd-item-sub">Heirloom client task</div></div></div>
      <div class="cmd-item"><div class="cmd-dot cd-navy"></div><div class="cmd-item-body"><div class="cmd-item-label">Navy / dark blue chip</div><div class="cmd-item-sub">Harbor · Build AI · payroll pay date</div></div></div>
      <div class="cmd-item"><div class="cmd-dot cd-silver"></div><div class="cmd-item-body"><div class="cmd-item-label">Silver / grey chip</div><div class="cmd-item-sub">General / recurring task (inbox check, timesheets)</div></div></div>
      <div class="cmd-item"><div style="width:7px;height:7px;border-radius:2px;background:var(--s-purple);flex-shrink:0;margin-top:5px"></div><div class="cmd-item-body"><div class="cmd-item-label">Purple chip / border</div><div class="cmd-item-sub">BD milestone (BD 5 close, BD 8 delivery, BD 9 BvA, BD 15)</div></div></div>
      <div class="cmd-item"><div style="width:32px;height:12px;border-radius:2px;background:var(--s-red);flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center"><span style="color:#fff;font-size:7px;font-weight:800">⚑ DUE</span></div><div class="cmd-item-body" style="margin-left:4px"><div class="cmd-item-label">⚑ DUE badge</div><div class="cmd-item-sub">This specific task is due on this date — no extensions</div></div></div>
      <div class="cmd-item"><div class="cmd-dot" style="background:#f9a840"></div><div class="cmd-item-body"><div class="cmd-item-label">Gold / warm highlight</div><div class="cmd-item-sub">Notes & reminders — send receipt reminder, staff comms</div></div></div>
      <div class="cmd-item" style="border-bottom:none"><div style="font-size:14px;flex-shrink:0;margin-top:1px">🇺🇸🇮🇳🇿🇦</div><div class="cmd-item-body" style="margin-left:4px"><div class="cmd-item-label">Flag icons in calendar</div><div class="cmd-item-sub">Holiday flag — work continues per schedule, team may be limited</div></div></div>
    </div>`;
}

/* ══════════════════════════════════════════════════════════
   VIEW + PERSON SWITCHING
══════════════════════════════════════════════════════════ */
function setView(v) {
  currentView = v;
  ['month','week','day'].forEach(x=>{
    document.getElementById(`view-${x}`)?.classList.toggle('active', x===v);
    document.getElementById(`svbtn-${x}`)?.classList.toggle('active', x===v);
    document.getElementById(`tvbtn-${x}`)?.classList.toggle('active', x===v);
  });
  updateTopbar();
  if (v==='month') renderMonth();
  if (v==='week') renderWeek();
  if (v==='day') renderDay();
  updateStats();
}

function setPerson(key) {
  currentPerson = key;
  document.querySelectorAll('.sb-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`sbp-${key}`)?.classList.add('active');
  renderPersonBanner();
  updateTopbar();
  if (currentView==='month') renderMonth();
  if (currentView==='week') renderWeek();
  if (currentView==='day') renderDayDetail();
  updateStats();
}

function renderPersonBanner() {
  const el = document.getElementById('personBannerEl');
  if (currentPerson==='all') { el.innerHTML=''; return; }
  const p = PEOPLE.find(x=>x.key===currentPerson);
  if (!p) { el.innerHTML=''; return; }
  el.innerHTML = `<div class="person-banner">
    <div class="pb-av ${p.acls}">${p.init}</div>
    <div class="pb-info"><div class="pb-name">Viewing: ${p.name}</div><div class="pb-role">${p.role}</div></div>
    <button class="pb-clear" onclick="setPerson('all')">Clear Filter</button>
  </div>`;
}

function updateTopbar() {
  const pn = currentPerson==='all'?'All Team':(PEOPLE.find(x=>x.key===currentPerson)?.name||'');
  const vn = {month:'Month view',week:'Week view',day:'Daily view'}[currentView];
  document.getElementById('tbTitle').textContent = 'Operations Calendar';
  document.getElementById('tbSub').textContent = `${pn} · ${vn}`;
}

/* ══════════════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════════════ */
function changeMonth(dir) {
  currentMonthIdx = Math.max(0, Math.min(MONTH_KEYS.length-1, currentMonthIdx+dir));
  renderMonth(); updateStats();
}

function changeWeek(dir) {
  if (!currentWeekStart) return;
  currentWeekStart = new Date(currentWeekStart.getTime() + dir*7*86400000);
  renderWeek(); updateStats();
}

function shiftDays(dir) {
  // Advance/retreat 5 business days
  const allBD = [];
  for (const mn of MONTH_KEYS) {
    for (const r of (calData[mn]||[])) {
      if (r.isBusinessDay && r.date) allBD.push(r);
    }
  }
  if (!allBD.length) return;
  const anchor = current5Days[dir>0?4:0];
  if (!anchor) return;
  const anchorKey = `${anchor.date.getFullYear()}-${anchor.date.getMonth()}-${anchor.date.getDate()}`;
  const idx = allBD.findIndex(r=>{
    const k=`${r.date.getFullYear()}-${r.date.getMonth()}-${r.date.getDate()}`;
    return k===anchorKey;
  });
  const start = Math.max(0, Math.min(allBD.length-5, dir>0?idx+1:idx-5));
  current5Days = allBD.slice(start, start+5);
  currentDayIdx = 0;
  renderDay(); updateStats();
}

function selectDay(idx) {
  currentDayIdx = idx;
  // Update strip visuals
  document.querySelectorAll('.day-pill').forEach((el,i)=>el.classList.toggle('active',i===idx));
  renderDayDetail();
}

/* ══════════════════════════════════════════════════════════
   SIDEBAR BUILD
══════════════════════════════════════════════════════════ */
function buildSidebar() {
  // Count tasks per person across next 5 days
  const counts = {};
  for (const p of PEOPLE) {
    if (p.key==='all') { counts[p.key]=null; continue; }
    let c=0;
    for (const row of current5Days) {
      const g=getTasksForRow(row); c+=(g[p.key]||[]).length;
    }
    counts[p.key]=c;
  }

  document.getElementById('sbPersonList').innerHTML = PEOPLE.map(p=>`
    <button class="sb-btn ${currentPerson===p.key?'active':''}" id="sbp-${p.key}" onclick="setPerson('${p.key}')">
      <div class="sb-av ${p.acls}">${p.init}</div>
      <div class="sb-pname">${p.name}</div>
      ${counts[p.key]!==null?`<div class="sb-pbadge">${counts[p.key]}</div>`:''}
    </button>`).join('');
}

/* ══════════════════════════════════════════════════════════
   INIT DASHBOARD
══════════════════════════════════════════════════════════ */
function initDashboard() {
  // Collect all business day rows
  const allBD = [];
  for (const mn of MONTH_KEYS) {
    for (const r of (calData[mn]||[])) {
      if (r.isBusinessDay && r.date) allBD.push(r);
    }
  }

  // Find today's position or start at beginning
  const today = new Date();
  const todayKey = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;
  let startIdx = allBD.findIndex(r=>`${r.date.getFullYear()}-${r.date.getMonth()}-${r.date.getDate()}` === todayKey);
  if (startIdx < 0) startIdx = 0;
  current5Days = allBD.slice(startIdx, startIdx+5);
  if (current5Days.length < 5) current5Days = allBD.slice(0, 5);

  // Set week start
  if (current5Days[0]?.date) {
    currentWeekStart = new Date(current5Days[0].date);
    while (currentWeekStart.getDay() !== 1) currentWeekStart = new Date(currentWeekStart.getTime()-86400000);
  }

  // Set current month
  if (today.getFullYear()===2026 && today.getMonth()>=3 && today.getMonth()<=11) {
    const mn = MONTH_KEYS[today.getMonth()-3];
    currentMonthIdx = MONTH_KEYS.indexOf(mn);
    if (currentMonthIdx<0) currentMonthIdx=0;
  }

  // Update date display
  // date display removed (static file)
  document.getElementById('sbFileName').textContent = 'TurnkeyCFO Operations 2026';

  // Show dashboard

  document.getElementById('dashboard').classList.add('show');

  buildSidebar();
  updateTopbar();
  renderMonth();
  updateStats();
}

function resetToUpload() {
  // No upload screen — just re-initialize with embedded data
  parseCalendarData();
  initDashboard();
}

// Auto-initialize with embedded data
document.addEventListener('DOMContentLoaded', () => {
  parseCalendarData();
  initDashboard();
});
</script>
