<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurnkeyCFO — Operations Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   MAVS PALETTE + TOKENS
═══════════════════════════════════════════════════ */
:root {
  /* Dallas Mavericks Official */
  --mavs-royal:   #00538C;
  --mavs-navy:    #002B5E;
  --mavs-silver:  #B8C4CA;
  --mavs-white:   #FFFFFF;

  /* Extended palette */
  --royal-dark:   #003f6b;
  --royal-mid:    #00538C;
  --royal-light:  #0a6baa;
  --royal-pale:   #cce3f4;
  --royal-ghost:  #e8f4fc;
  --royal-ultra:  #f0f8ff;

  --navy-deep:    #001a3d;
  --navy-mid:     #002B5E;
  --navy-muted:   #003878;

  --silver-dark:  #8a9aa4;
  --silver-mid:   #B8C4CA;
  --silver-light: #d8e2e8;
  --silver-pale:  #eef2f5;
  --silver-ultra: #f6f8fa;

  /* Semantic */
  --bg-page:      #f2f6fa;
  --bg-surface:   #ffffff;
  --bg-raised:    #f8fafc;
  --bg-overlay:   rgba(0,83,140,0.04);

  --text-primary:   #001a3d;
  --text-secondary: #2c4a6e;
  --text-muted:     #6b8aaa;
  --text-light:     #9ab0c8;

  --border-light: rgba(0,83,140,0.10);
  --border-mid:   rgba(0,83,140,0.18);
  --border-strong:#B8C4CA;

  /* Status colors */
  --green:  #0d9668;  --green-bg:  #e6f7f2;  --green-border: #a7e3d4;
  --yellow: #c47f00;  --yellow-bg: #fef8e6;  --yellow-border:#f5d98a;
  --red:    #c0392b;  --red-bg:    #fdf0ee;  --red-border:   #f5b7b1;
  --blue:   #00538C;  --blue-bg:   #e8f4fc;  --blue-border:  #99ccee;
  --purple: #6a3db8;  --purple-bg: #f3edfb;  --purple-border:#c9aaee;
  --teal:   #0891b2;  --teal-bg:   #e6f7fb;  --teal-border:  #a5daea;

  --shadow-xs: 0 1px 3px rgba(0,43,94,0.06);
  --shadow-sm: 0 2px 8px rgba(0,43,94,0.08), 0 1px 3px rgba(0,43,94,0.05);
  --shadow-md: 0 4px 20px rgba(0,43,94,0.10), 0 2px 6px rgba(0,43,94,0.06);
  --shadow-lg: 0 8px 40px rgba(0,43,94,0.14), 0 2px 8px rgba(0,43,94,0.07);
  --shadow-xl: 0 16px 60px rgba(0,43,94,0.16), 0 4px 12px rgba(0,43,94,0.08);

  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --radius-full: 9999px;

  --font-head: 'Sora', system-ui, sans-serif;
  --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;

  --transition: 0.18s cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg-page);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.6;
}

/* ═══════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════ */
.sidebar {
  position: fixed;
  left: 0; top: 0; bottom: 0;
  width: 240px;
  background: var(--mavs-navy);
  display: flex;
  flex-direction: column;
  z-index: 100;
  box-shadow: 4px 0 24px rgba(0,43,94,0.25);
}

/* Subtle diagonal texture on sidebar */
.sidebar::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    135deg,
    transparent 0px,
    transparent 40px,
    rgba(255,255,255,0.018) 40px,
    rgba(255,255,255,0.018) 41px
  );
  pointer-events: none;
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 24px 20px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  position: relative;
  flex-shrink: 0;
}

.logo-gem {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--mavs-royal) 0%, #0071bc 100%);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head);
  font-size: 15px; font-weight: 800;
  color: #fff;
  box-shadow: 0 2px 12px rgba(0,83,140,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
  flex-shrink: 0;
}

.logo-words { display: flex; flex-direction: column; }
.logo-brand {
  font-family: var(--font-head);
  font-size: 13.5px; font-weight: 700;
  color: #fff; line-height: 1.1;
  letter-spacing: -0.2px;
}
.logo-tagline {
  font-size: 9.5px; font-weight: 500;
  letter-spacing: 1.8px; text-transform: uppercase;
  color: rgba(184,196,202,0.7);
  margin-top: 2px;
}

/* Person filter */
.sidebar-section-label {
  font-size: 9px; font-weight: 700;
  letter-spacing: 2.5px; text-transform: uppercase;
  color: rgba(184,196,202,0.5);
  padding: 20px 20px 8px;
  flex-shrink: 0;
}

.person-list { padding: 0 10px; flex-shrink: 0; }

.person-btn {
  display: flex; align-items: center;
  gap: 10px; width: 100%;
  padding: 9px 12px;
  border-radius: var(--radius-md);
  border: none; background: transparent;
  cursor: pointer;
  transition: var(--transition);
  margin-bottom: 2px;
  position: relative;
}

.person-btn:hover { background: rgba(255,255,255,0.07); }

.person-btn.active {
  background: rgba(0,83,140,0.55);
  box-shadow: 0 2px 12px rgba(0,83,140,0.4);
}

.person-btn.active::before {
  content: '';
  position: absolute; left: 0; top: 20%; bottom: 20%;
  width: 3px; border-radius: 0 3px 3px 0;
  background: #fff;
}

.p-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  flex-shrink: 0;
  transition: var(--transition);
}

.pa-all     { background: linear-gradient(135deg,#00538C,#0071bc); color:#fff; }
.pa-ricky   { background: linear-gradient(135deg,#c47f00,#e09500); color:#fff; }
.pa-hardik  { background: linear-gradient(135deg,#00538C,#0071bc); color:#fff; }
.pa-eldine  { background: linear-gradient(135deg,#0d9668,#10b87e); color:#fff; }
.pa-nik     { background: linear-gradient(135deg,#6a3db8,#7f52cc); color:#fff; }
.pa-events  { background: linear-gradient(135deg,#c0392b,#e04535); color:#fff; }

.p-name {
  font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,0.85);
  text-align: left; flex: 1;
}
.person-btn.active .p-name { color: #fff; }

.p-badge {
  font-size: 10px; font-weight: 700;
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.6);
  padding: 1px 6px; border-radius: var(--radius-full);
}
.person-btn.active .p-badge {
  background: rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.9);
}

/* View toggle */
.sidebar-divider {
  height: 1px;
  background: rgba(255,255,255,0.07);
  margin: 16px 20px 0;
  flex-shrink: 0;
}

.view-list { padding: 8px 10px 0; flex-shrink: 0; }

.view-btn {
  display: flex; align-items: center;
  gap: 10px; width: 100%;
  padding: 9px 12px;
  border-radius: var(--radius-md);
  border: none; background: transparent;
  cursor: pointer;
  transition: var(--transition);
  margin-bottom: 2px;
  color: rgba(255,255,255,0.6);
  font-family: var(--font-body);
  font-size: 13px; font-weight: 500;
}

.view-btn:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); }

.view-btn.active {
  background: rgba(0,83,140,0.55);
  color: #fff;
  font-weight: 600;
}

.view-icon { font-size: 14px; width: 18px; text-align: center; }

/* Sidebar footer */
.sidebar-footer {
  margin-top: auto;
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.07);
  flex-shrink: 0;
}

.live-indicator {
  display: flex; align-items: center; gap: 7px;
  font-size: 10.5px; color: rgba(184,196,202,0.6);
}
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #22c55e;
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ═══════════════════════════════════════════════════
   MAIN CONTENT
═══════════════════════════════════════════════════ */
.main {
  margin-left: 240px;
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* Top bar */
.topbar {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-light);
  padding: 0 32px;
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
  box-shadow: var(--shadow-xs);
  flex-shrink: 0;
}

.topbar-left { display: flex; flex-direction: column; gap: 2px; }

.topbar-title {
  font-family: var(--font-head);
  font-size: 16px; font-weight: 700;
  color: var(--text-primary);
}

.topbar-subtitle { font-size: 11.5px; color: var(--text-muted); }

.topbar-right { display: flex; align-items: center; gap: 12px; }

.topbar-date {
  font-size: 12px;
  color: var(--text-muted);
  background: var(--silver-pale);
  padding: 5px 12px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-light);
}

.topbar-view-toggle {
  display: flex;
  background: var(--silver-pale);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 3px;
  gap: 2px;
}

.tv-btn {
  padding: 5px 13px;
  border-radius: var(--radius-xs);
  border: none;
  background: transparent;
  font-family: var(--font-body);
  font-size: 12px; font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  transition: var(--transition);
}
.tv-btn:hover { color: var(--text-primary); }
.tv-btn.active {
  background: var(--bg-surface);
  color: var(--mavs-royal);
  box-shadow: var(--shadow-xs);
}

/* Content area */
.content { flex: 1; padding: 28px 32px 48px; }

/* ═══════════════════════════════════════════════════
   HERO STATS
═══════════════════════════════════════════════════ */
.hero-stats {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 14px;
  margin-bottom: 28px;
}

.stat-chip {
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}
.stat-chip:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }

.stat-chip::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
}
.sc-royal::before { background: linear-gradient(90deg,var(--mavs-royal),var(--royal-light)); }
.sc-navy::before  { background: linear-gradient(90deg,var(--mavs-navy),var(--navy-muted)); }
.sc-green::before { background: linear-gradient(90deg,var(--green),#12b080); }
.sc-red::before   { background: linear-gradient(90deg,var(--red),#e04535); }

.sc-icon { font-size: 22px; margin-bottom: 8px; }
.sc-value {
  font-family: var(--font-head);
  font-size: 30px; font-weight: 800;
  color: var(--text-primary);
  line-height: 1;
  margin-bottom: 4px;
}
.sc-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
.sc-sub { font-size: 11px; color: var(--text-light); margin-top: 2px; }

/* ═══════════════════════════════════════════════════
   ALERT BANNERS
═══════════════════════════════════════════════════ */
.alert-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }

.alert-bar {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  border-left: 4px solid;
  animation: slideIn .3s ease;
}
.alert-bar.red    { background:var(--red-bg);    border-left-color:var(--red);    border:1px solid var(--red-border); border-left:4px solid var(--red); }
.alert-bar.yellow { background:var(--yellow-bg); border-left-color:var(--yellow); border:1px solid var(--yellow-border); border-left:4px solid var(--yellow); }
.alert-bar.green  { background:var(--green-bg);  border-left-color:var(--green);  border:1px solid var(--green-border); border-left:4px solid var(--green); }

.alert-icon { font-size: 16px; flex-shrink:0; margin-top:1px; }
.alert-content { flex:1; }
.alert-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing:.5px; margin-bottom:2px; }
.alert-bar.red    .alert-title { color:var(--red); }
.alert-bar.yellow .alert-title { color:var(--yellow); }
.alert-bar.green  .alert-title { color:var(--green); }
.alert-body { font-size: 12.5px; color: var(--text-secondary); line-height:1.5; }

@keyframes slideIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:none} }

/* ═══════════════════════════════════════════════════
   SECTION HEADER
═══════════════════════════════════════════════════ */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; flex-wrap: wrap; gap: 10px;
}

.section-title {
  font-family: var(--font-head);
  font-size: 18px; font-weight: 700;
  color: var(--text-primary);
  display: flex; align-items: center; gap: 10px;
}

.section-pill {
  font-size: 11px; font-weight: 700;
  background: var(--royal-ghost);
  color: var(--mavs-royal);
  border: 1px solid var(--royal-pale);
  padding: 3px 10px;
  border-radius: var(--radius-full);
}

/* ═══════════════════════════════════════════════════
   MONTH VIEW — CALENDAR GRID
═══════════════════════════════════════════════════ */
.month-nav {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px;
}

.mnav-btn {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-light);
  background: var(--bg-surface);
  color: var(--text-secondary);
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
  box-shadow: var(--shadow-xs);
}
.mnav-btn:hover { background: var(--royal-ghost); border-color: var(--royal-pale); color: var(--mavs-royal); }

.mnav-label {
  font-family: var(--font-head);
  font-size: 16px; font-weight: 700;
  color: var(--text-primary);
  min-width: 160px; text-align: center;
}

.cal-grid-wrap {
  background: var(--bg-surface);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}

.cal-dow-row {
  display: grid; grid-template-columns: repeat(7,1fr);
  background: var(--mavs-navy);
}

.cal-dow {
  padding: 12px 8px;
  text-align: center;
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(255,255,255,0.6);
}
.cal-dow.weekday { color: rgba(255,255,255,0.9); }

.cal-weeks { display: flex; flex-direction: column; }

.cal-week {
  display: grid; grid-template-columns: repeat(7,1fr);
  border-bottom: 1px solid var(--border-light);
}
.cal-week:last-child { border-bottom: none; }

.cal-cell {
  min-height: 110px;
  padding: 8px 9px;
  border-right: 1px solid var(--border-light);
  position: relative;
  vertical-align: top;
  transition: background var(--transition);
  cursor: pointer;
}
.cal-cell:last-child { border-right: none; }
.cal-cell.outside  { background: var(--silver-ultra); }
.cal-cell.weekend  { background: #fafbfd; }
.cal-cell.us-hol   { background: #fff5f4; }
.cal-cell.today    { background: var(--royal-ultra); }
.cal-cell.has-tasks:hover { background: var(--royal-ghost); }

.cal-cell.has-payroll-urgent { background: #fff8f7; }
.cal-cell.has-payroll-yellow { background: #fffcf0; }
.cal-cell.has-payroll-green  { background: #f4fdf8; }
.cal-cell.has-milestone      { background: #f5f0fd; }

.cell-num {
  font-family: var(--font-head);
  font-size: 13px; font-weight: 700;
  color: var(--text-muted);
  line-height: 1; margin-bottom: 5px;
  display: flex; align-items: center; gap: 5px;
}
.cal-cell.outside .cell-num { color: var(--text-light); }
.cal-cell.today .cell-num { color: var(--mavs-royal); }
.cal-cell.weekend .cell-num { color: var(--silver-dark); }

.cell-bd {
  display: inline-block;
  font-size: 8.5px; font-weight: 700;
  background: var(--mavs-royal);
  color: #fff;
  padding: 1px 5px; border-radius: 3px;
  letter-spacing: 0.3px;
}

.cell-chips { display: flex; flex-direction: column; gap: 3px; }

.cell-chip {
  display: flex; align-items: flex-start; gap: 4px;
  font-size: 10.5px; font-weight: 500;
  padding: 3px 5px;
  border-radius: 5px;
  line-height: 1.35;
  cursor: pointer;
  transition: filter var(--transition);
}
.cell-chip:hover { filter: brightness(0.95); }

.chip-icon { flex-shrink: 0; font-size: 10px; margin-top: 0.5px; }
.chip-text { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* Chip themes */
.chip-payroll-red    { background:#fde8e6; color:#9b2516; }
.chip-payroll-yellow { background:#fef7e0; color:#8a5800; }
.chip-payroll-green  { background:#e6f7ef; color:#076041; }
.chip-milestone      { background:#ede8fb; color:#4a2590; }
.chip-heirloom       { background:#e6f2fa; color:#003f6b; }
.chip-harbor         { background:#e8f5ee; color:#075730; }
.chip-general        { background:#eef2f8; color:#2c4a6e; }
.chip-eldine         { background:#fef7e8; color:#7a5000; }
.chip-nik            { background:#f3edfb; color:#4a2590; }
.chip-close          { background:#fff0ed; color:#8a2c1a; }
.chip-us-hol         { background:#fde8e6; color:#9b2516; font-style:italic; }

.cell-more {
  font-size: 9.5px; font-weight: 600;
  color: var(--mavs-royal);
  margin-top: 3px;
  padding: 2px 4px;
}

/* ═══════════════════════════════════════════════════
   WEEK VIEW
═══════════════════════════════════════════════════ */
.week-nav {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
}

.week-day-cols {
  display: grid;
  grid-template-columns: repeat(5,1fr);
  gap: 12px;
}

.week-col {
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}
.week-col:hover { box-shadow: var(--shadow-md); }
.week-col.today-col { border-color: var(--mavs-royal); box-shadow: 0 0 0 2px rgba(0,83,140,0.15), var(--shadow-sm); }
.week-col.has-payroll-urgent { border-top: 3px solid var(--red); }
.week-col.has-payroll-yellow { border-top: 3px solid var(--yellow); }
.week-col.has-payroll-green  { border-top: 3px solid var(--green); }
.week-col.milestone-col      { border-top: 3px solid #6a3db8; }

.wcol-head {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border-light);
  background: var(--silver-ultra);
}
.wcol-head.today-head { background: var(--royal-ghost); }

.wcol-dow {
  font-size: 9.5px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 2px;
}
.wcol-head.today-head .wcol-dow { color: var(--mavs-royal); }

.wcol-date {
  font-family: var(--font-head);
  font-size: 22px; font-weight: 800;
  color: var(--text-primary); line-height: 1;
}
.wcol-head.today-head .wcol-date { color: var(--mavs-royal); }

.wcol-bd {
  display: inline-block; margin-top: 5px;
  font-size: 9px; font-weight: 700;
  background: var(--mavs-navy); color: #fff;
  padding: 2px 7px; border-radius: var(--radius-full);
}

.wcol-body { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 7px; }

.week-task {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 9px 10px;

<script>
/* ═══════════════════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════════════════ */
const US_HOLIDAYS = {
  '2026-04-03':'Good Friday 🇺🇸','2026-05-25':'Memorial Day 🇺🇸',
  '2026-07-03':'Independence Day Obs. 🇺🇸','2026-07-04':'Independence Day 🇺🇸',
  '2026-09-07':'Labor Day 🇺🇸','2026-10-12':'Columbus Day 🇺🇸',
  '2026-11-11':'Veterans Day 🇺🇸','2026-11-26':'Thanksgiving 🇺🇸',
  '2026-11-27':'Thanksgiving Fri. 🇺🇸','2026-12-25':'Christmas 🇺🇸',
};
const INDIA_HOLIDAYS = {
  '2026-04-02':'Ram Navami 🇮🇳','2026-04-06':'Mahavir Jayanti 🇮🇳',
  '2026-04-14':'Ambedkar Jayanti 🇮🇳','2026-05-13':'Buddha Purnima 🇮🇳',
  '2026-08-15':'Independence Day 🇮🇳','2026-09-02':'Janmashtami 🇮🇳',
  '2026-10-02':'Gandhi Jayanti 🇮🇳','2026-10-20':'Dussehra 🇮🇳',
  '2026-11-08':'Diwali 🇮🇳','2026-11-09':'Diwali Holiday 🇮🇳',
  '2026-12-25':'Christmas 🇮🇳',
};
const SA_HOLIDAYS = {
  '2026-04-03':'Good Friday 🇿🇦','2026-04-06':'Easter Monday 🇿🇦',
  '2026-04-27':'Freedom Day 🇿🇦','2026-05-01':"Workers' Day 🇿🇦",
  '2026-06-16':'Youth Day 🇿🇦','2026-08-10':"Women's Day 🇿🇦",
  '2026-09-24':'Heritage Day 🇿🇦','2026-12-16':'Day of Reconciliation 🇿🇦',
  '2026-12-25':'Christmas 🇿🇦','2026-12-26':'Day of Goodwill 🇿🇦',
};

const MONTH_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function iso(d){ return d.toISOString().slice(0,10); }
function isWE(d){ return d.getDay()===0||d.getDay()===6; }
function isUSH(d){ return !!US_HOLIDAYS[iso(d)]; }
function isBD(d){ return !isWE(d)&&!isUSH(d); }

function addD(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function addBD(d,n){
  let cur=new Date(d),count=0,dir=n>=0?1:-1,steps=Math.abs(n);
  while(count<steps){ cur=addD(cur,dir); if(isBD(cur))count++; }
  return cur;
}
function prevFri(d){
  let r=new Date(d);
  while(r.getDay()===0||r.getDay()===6) r=addD(r,-1);
  return r;
}
function getBDsInMonth(y,m){
  const days=[]; const last=new Date(y,m,0).getDate();
  for(let d=1;d<=last;d++){ const dt=new Date(y,m-1,d); if(isBD(dt))days.push(dt); }
  return days;
}
function nthBD(y,m,n){ const b=getBDsInMonth(y,m); return b[n-1]||null; }
function bdNum(d){
  if(!isBD(d))return 0;
  const b=getBDsInMonth(d.getFullYear(),d.getMonth()+1);
  const i=b.findIndex(x=>iso(x)===iso(d)); return i>=0?i+1:0;
}
function calDay(y,m,n){
  const l=new Date(y,m,0).getDate(); return n<=l?new Date(y,m-1,n):null;
}
function firstBDOnOrAfter(y,m,day){
  let d=new Date(y,m-1,day); while(!isBD(d))d=addD(d,1); return d;
}
function eomMinus5BD(y,m){
  const l=new Date(y,m,0).getDate(); let d=new Date(y,m-1,l),c=0;
  while(c<5){ d=addD(d,-1); if(isBD(d))c++; } return d;
}
function lastBizWeekMon(y,m){
  const l=new Date(y,m,0).getDate(); let d=new Date(y,m-1,l);
  while(d.getDay()!==1)d=addD(d,-1);
  while(!isBD(d)&&d.getMonth()===m-1)d=addD(d,1);
  return d;
}

/* PAYROLL */
function buildPayrollDates(){
  const out=new Map();
  for(let mo=4;mo<=12;mo++){
    const last=new Date(2026,mo,0).getDate();
    for(const day of[15,last]){
      const pd=prevFri(new Date(2026,mo-1,day));
      out.set(iso(pd),pd);
    }
  }
  return [...out.values()].sort((a,b)=>a-b);
}
const PAYROLL_DATES=buildPayrollDates();

function buildPayrollMap(){
  const m=new Map();
  const add=(d,e)=>{ const k=iso(d); if(!m.has(k))m.set(k,[]); m.get(k).push(e); };
  for(const pd of PAYROLL_DATES){
    const cd=addBD(pd,-2), r1=addBD(cd,-3), r2=addBD(cd,-2), r3=addBD(cd,-1);
    add(pd,{type:'PAY_DATE',payDate:pd,cashDue:cd});
    add(cd,{type:'CASH_DUE',payDate:pd,cashDue:cd});
    add(r1,{type:'REMIND_GREEN',payDate:pd,cashDue:cd});
    add(r2,{type:'REMIND_YELLOW',payDate:pd,cashDue:cd});
    add(r3,{type:'REMIND_RED',payDate:pd,cashDue:cd});
  }
  return m;
}
const PAYROLL_MAP=buildPayrollMap();

function fmtS(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

// Init week/day based on today or Apr 1
function initDateState(){
  const today=new Date();
  const rangeStart=new Date(2026,3,1), rangeEnd=new Date(2026,11,31);
  let ref=(today>=rangeStart&&today<=rangeEnd)?today:rangeStart;
  // Week: find Monday of ref week
  let mon=new Date(ref);
  while(mon.getDay()!==1) mon=addD(mon,-1);
  currentWeekStart=mon;
  // 5 days starting from ref
  let day=new Date(ref);
  while(!isBD(day)) day=addD(day,1);
  current5Days=[];
  let cur=new Date(day);
  while(current5Days.length<5){ if(isBD(cur))current5Days.push(new Date(cur)); cur=addD(cur,1); }
  currentDayIndex=0;
}

/* ═══════════════════════════════════════════════════════════
   CELL COLOR LOGIC
═══════════════════════════════════════════════════════════ */
function cellColorCls(d){
  const evts=PAYROLL_MAP.get(iso(d))||[];
  for(const ev of evts){
    if(ev.type==='CASH_DUE'||ev.type==='REMIND_RED') return 'has-payroll-urgent';
    if(ev.type==='REMIND_YELLOW') return 'has-payroll-yellow';
    if(ev.type==='REMIND_GREEN') return 'has-payroll-green';
  }
  const bn=bdNum(d);
  if([5,8,9,15].includes(bn)) return 'has-milestone';
  return 'has-tasks';
}

function cellChips(d){
  const tasks=buildTasks(d);
  const flat=filterTasks(tasks);
  const all=Object.values(flat).flat();
  if(!all.length) return '';

  const chips=[];
  for(const t of all.slice(0,3)){
    let cls='chip-general';
    if(t.type==='payroll'||(t.p==='urgent'&&t.type==='payroll')) cls='chip-payroll-red';
    else if(t.type==='payroll') cls='chip-payroll-green';
    else if(t.type==='milestone') cls='chip-milestone';
    else if(t.tags?.includes('heirloom')) cls='chip-heirloom';
    else if(t.tags?.includes('harbor')||t.tags?.includes('buildai')) cls='chip-harbor';
    else if(t.tags?.includes('voh')||t.tags?.includes('mosquera')) cls='chip-eldine';

    // payroll specific
    if(['PAY_DATE','CASH_DUE'].some(x=>t.type==='payroll'&&t.icon==='🔴')) cls='chip-payroll-red';
    if(t.icon==='🟡') cls='chip-payroll-yellow';
    if(t.icon==='🟢') cls='chip-payroll-green';

    chips.push(`<div class="cell-chip ${cls}">
      <span class="chip-icon">${t.icon}</span>
      <span class="chip-text">${t.label}</span>
    </div>`);
  }
  const more=all.length-3;
  return chips.join('')+(more>0?`<div class="cell-more">+${more} more</div>`:'');
}

function getHols(d){
  const k=iso(d), out=[];
  if(US_HOLIDAYS[k]) out.push(US_HOLIDAYS[k]);
  if(INDIA_HOLIDAYS[k]) out.push(INDIA_HOLIDAYS[k]);
  if(SA_HOLIDAYS[k]) out.push(SA_HOLIDAYS[k]);
  return out;
}

/* ═══════════════════════════════════════════════════════════
   RENDER: MONTH VIEW
═══════════════════════════════════════════════════════════ */
function renderMonth(){
  const y=currentYear, m=currentMonth; // m is 0-indexed
  document.getElementById('mnav-label').textContent=`${MONTH_NAMES[m]} ${y}`;
  document.getElementById('monthViewTitle').textContent='Monthly Calendar';
  document.getElementById('monthViewPill').textContent=`${MONTH_NAMES[m]} ${y}`;

  // Build weeks (Mon-start)
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  const today=new Date();

  // Start from Monday before or on first
  let cur=new Date(first);
  while(cur.getDay()!==1) cur=addD(cur,-1);

  let html='';
  while(cur<=last||(cur.getDay()!==1)){
    html+='<div class="cal-week">';
    for(let i=0;i<7;i++){
      const d=new Date(cur);
      addD(cur,i); // just reference
      const dd=addD(cur,i-7); // shift back - recalculate
      // simpler:
      const dayDate=new Date(cur.getTime()+(i)*86400000);
      const outside=dayDate.getMonth()!==m;
      const weekend=isWE(dayDate);
      const usHol=isUSH(dayDate);
      const isToday=iso(dayDate)===iso(today);
      const bn=isBD(dayDate)?bdNum(dayDate):0;
      const hols=getHols(dayDate);
      const ccls=cellColorCls(dayDate);

      let cellCls='cal-cell';
      if(outside) cellCls+=' outside';
      else if(usHol) cellCls+=' us-hol';
      else if(weekend) cellCls+=' weekend';
      else if(isToday) cellCls+=' today';
      if(!outside&&!weekend&&!usHol) cellCls+=` ${ccls}`;

      const numHtml=`<div class="cell-num">
        ${dayDate.getDate()}
        ${bn&&!outside?`<span class="cell-bd">BD${bn}</span>`:''}
      </div>`;

      let innerHtml='';
      if(outside){
        innerHtml=`<div class="cell-num" style="color:var(--text-light)">${dayDate.getDate()}</div>`;
      } else if(usHol){
        innerHtml=numHtml+`<div class="cell-chips"><div class="cell-chip chip-us-hol"><span class="chip-icon">🇺🇸</span><span class="chip-text">${US_HOLIDAYS[iso(dayDate)]}</span></div></div>`;
      } else {
        const holFl=hols.filter(h=>!h.includes('🇺🇸'));
        const holHtml=holFl.length?holFl.map(h=>`<div style="font-size:9.5px;color:var(--yellow);font-weight:600;line-height:1.2">${h}</div>`).join(''):'';
        innerHtml=numHtml+(holHtml?`<div style="margin-bottom:3px">${holHtml}</div>`:'')+`<div class="cell-chips">${outside?'':cellChips(dayDate)}</div>`;
      }

      const clickAttr=(outside||weekend||usHol)?'':`onclick="openDayModal('${iso(dayDate)}')"`;
      html+=`<div class="${cellCls}" ${clickAttr}>${innerHtml}</div>`;
    }
    html+='</div>';
    cur=addD(cur,7);
    if(cur>last&&cur.getDay()===1) break;
  }
  document.getElementById('calWeeks').innerHTML=html;
}

/* ═══════════════════════════════════════════════════════════
   RENDER: WEEK VIEW
═══════════════════════════════════════════════════════════ */
function renderWeek(){
  // 5 business days from currentWeekStart
  const wDays=[];
  let cur=new Date(currentWeekStart);
  while(cur.getDay()!==1) cur=addD(cur,-1); // ensure Monday
  currentWeekStart=new Date(cur);

  // Collect Mon–Fri of this week
  for(let i=0;i<7;i++){
    const d=new Date(cur.getTime()+i*86400000);
    if(!isWE(d)) wDays.push(d);
  }

  const start=wDays[0], end=wDays[wDays.length-1];
  document.getElementById('wnav-label').textContent=
    `${start.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;

  const today=new Date();
  let html='';

  for(const d of wDays){
    const usHol=isUSH(d), bn=isBD(d)?bdNum(d):0;
    const isToday=iso(d)===iso(today);
    const evts=PAYROLL_MAP.get(iso(d))||[];
    const hasPayUrgent=evts.some(e=>e.type==='CASH_DUE'||e.type==='REMIND_RED');
    const hasPayYellow=evts.some(e=>e.type==='REMIND_YELLOW');
    const hasPayGreen=evts.some(e=>e.type==='REMIND_GREEN');
    const bdn=bn; const isMile=[5,8,9,15].includes(bdn);

    let colCls='week-col';
    if(isToday) colCls+=' today-col';
    if(hasPayUrgent) colCls+=' has-payroll-urgent';
    else if(hasPayYellow) colCls+=' has-payroll-yellow';
    else if(hasPayGreen) colCls+=' has-payroll-green';
    else if(isMile) colCls+=' milestone-col';

    const headCls=isToday?'wcol-head today-head':'wcol-head';

    const tasks=buildTasks(d);
    const filtered=filterTasks(tasks);
    const allFlat=Object.values(filtered).flat();

    const taskHtml=usHol
      ? `<div class="week-task wt-normal"><div class="wt-icon">🇺🇸</div><div class="wt-content"><div class="wt-label">${US_HOLIDAYS[iso(d)]}</div><div class="wt-who">US Holiday — Closed</div></div></div>`
      : (allFlat.length===0
          ? `<div class="no-tasks"><div class="no-tasks-icon">☑</div><div>Clear day</div></div>`
          : allFlat.map(t=>weekTaskHTML(t)).join(''));

    const hols=getHols(d).filter(h=>!h.includes('🇺🇸'));
    const holHtml=hols.length?`<div style="font-size:10px;color:var(--yellow);font-weight:600;padding:4px 14px;border-bottom:1px solid var(--border-light)">${hols.join(' · ')}</div>`:'';

    html+=`<div class="${colCls}">
      <div class="${headCls}">
        <div class="wcol-dow">${DOW_SHORT[d.getDay()]}</div>
        <div class="wcol-date">${d.getDate()}</div>
        ${bn?`<div class="wcol-bd">BD ${bn}</div>`:''}
      </div>
      ${holHtml}
      <div class="wcol-body">${taskHtml}</div>
    </div>`;
  }
  document.getElementById('weekCols').innerHTML=html;
}

/* ═══════════════════════════════════════════════════════════
   RENDER: DAY VIEW
═══════════════════════════════════════════════════════════ */
function renderDay(){
  // Day strip (5 days)
  let stripHtml='';
  const today=new Date();
  for(let i=0;i<current5Days.length;i++){
    const d=current5Days[i];
    const bn=bdNum(d);
    const evts=PAYROLL_MAP.get(iso(d))||[];
    const hasPay=evts.length>0;
    const isPayUrgent=evts.some(e=>e.type==='CASH_DUE'||e.type==='PAY_DATE'||e.type==='REMIND_RED');
    const isMile=[5,8,9,15].includes(bn);
    const isToday2=iso(d)===iso(today);

    let badge='';
    if(isPayUrgent) badge=`<span class="dp-badge dpb-payroll">Payroll</span>`;
    else if(isMile) badge=`<span class="dp-badge dpb-mile">Milestone</span>`;
    else if(bn) badge=`<span class="dp-badge dpb-bd">BD ${bn}</span>`;

    stripHtml+=`<div class="day-pill ${i===currentDayIndex?'active':''}" onclick="selectDay(${i})">
      <div class="dp-dow">${DOW_SHORT[d.getDay()]}</div>
      <div class="dp-num">${d.getDate()}</div>
      <div class="dp-mon">${MONTH_NAMES[d.getMonth()].slice(0,3)}</div>
      ${badge}
    </div>`;
  }
  document.getElementById('dayStrip').innerHTML=stripHtml;
  renderDayDetail();
}

function renderDayDetail(){
  const d=current5Days[currentDayIndex];
  if(!d) return;
  const bn=bdNum(d);
  const hols=getHols(d);
  const tasks=buildTasks(d);

  const holHtml=hols.length?`
    <div class="alert-bar yellow" style="margin-bottom:16px">
      <div class="alert-icon">🌍</div>
      <div class="alert-content">
        <div class="alert-title">Holiday Flags</div>
        <div class="alert-body">${hols.join(' · ')}</div>
      </div>
    </div>`:'';

  // Person columns
  let colsHtml='';
  const showPeople=currentPerson==='all'
    ? PEOPLE_DEF.filter(p=>p.key!=='all')
    : PEOPLE_DEF.filter(p=>p.key===currentPerson&&p.key!=='all');

  for(const p of showPeople){
    const pTasks=tasks[p.key]||[];
    if(currentPerson!=='all'&&pTasks.length===0) continue;
    const bodyHtml=pTasks.length===0
      ? `<div class="no-tasks"><div class="no-tasks-icon">☑</div><div>No tasks today</div></div>`
      : `<div class="task-list">${pTasks.map(t=>taskItemHTML(t)).join('')}</div>`;

    colsHtml+=`<div class="person-col">
      <div class="pcol-head ph-${p.key}">
        <div class="pcol-avatar ${p.pcls}">${p.init}</div>
        <div class="pcol-info">
          <div class="pcol-name">${p.name}</div>
          <div class="pcol-role">${p.role}</div>
        </div>
        ${pTasks.length?`<div class="pcol-count">${pTasks.length}</div>`:''}
      </div>
      <div class="pcol-body">${bodyHtml}</div>
    </div>`;
  }

  const allFlat=Object.values(tasks).flat();
  const totalTasks=currentPerson==='all'?allFlat.length:(tasks[currentPerson]||[]).length;

  document.getElementById('dayDetailContent').innerHTML=`
    <div class="day-detail-header">
      <div class="ddh-left">
        <div class="ddh-title">${d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div>
        <div class="ddh-sub">
          ${bn?`Business Day ${bn} of ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`:''}
        </div>
      </div>
      <div class="ddh-right">
        <div class="ddh-pill">📋 ${totalTasks} task${totalTasks!==1?'s':''}</div>
        ${bn?`<div class="ddh-pill" style="background:var(--royal-ghost);color:var(--mavs-royal);border-color:var(--royal-pale)">BD ${bn}</div>`:''}
      </div>
    </div>
    ${holHtml}
    <div class="day-person-grid">${colsHtml||'<div style="color:var(--text-muted);padding:20px">No tasks for this person today.</div>'}</div>`;
}

/* ═══════════════════════════════════════════════════════════
   MODAL (click calendar cell)
═══════════════════════════════════════════════════════════ */
function openDayModal(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  const bn=bdNum(d);
  const hols=getHols(d);
  const tasks=buildTasks(d);

  document.getElementById('modalTitle').textContent=
    d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('modalSub').textContent=
    `${bn?`Business Day ${bn}`:''} ${hols.length?'· '+hols.join(' · '):''}`;

  // Build modal body with all tasks merged with person labels
  const map={ricky:'👤 Ricky',hardik:'👤 Hardik',eldine:'👤 Eldine',nik:'👤 Nik',events:'📌 Key Events'};
  const allTasksHTML=Object.entries(tasks).map(([k,arr])=>{
    if(!arr.length) return '';
    const filtered=currentPerson==='all'||currentPerson===k;
    if(!filtered) return '';
    return `<div style="margin-bottom:14px">
      <div style="font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:7px">${map[k]}</div>
      <div class="task-list">${arr.map(t=>taskItemHTML(t)).join('')}</div>
    </div>`;
  }).join('');

  document.getElementById('modalBody').innerHTML=allTasksHTML||`<div class="no-tasks"><div class="no-tasks-icon">🗓</div><div>No tasks this day.</div></div>`;
  document.getElementById('modal').classList.add('open');
}

function closeModal(e){
  if(!e||e.target===document.getElementById('modal')||e.type==='click')
    document.getElementById('modal').classList.remove('open');
}

/* ═══════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════ */
function changeMonth(dir){
  currentMonth+=dir;
  if(currentMonth>11){currentMonth=0;currentYear++;}
  if(currentMonth<0){currentMonth=11;currentYear--;}
  // Clamp to Apr–Dec 2026
  if(currentYear<2026||( currentYear===2026&&currentMonth<3)){currentYear=2026;currentMonth=3;}
  if(currentYear>2026||( currentYear===2026&&currentMonth>11)){currentYear=2026;currentMonth=11;}
  renderMonth();
  updateStats();
}

function changeWeek(dir){
  currentWeekStart=addD(currentWeekStart,dir*7);
  // Clamp
  const start=new Date(2026,3,1), end=new Date(2026,11,31);
  if(currentWeekStart<start) currentWeekStart=new Date(start);
  if(currentWeekStart>end) currentWeekStart=new Date(end);
  renderWeek();
  updateStats();
}

function shiftDay5(dir){
  // Move the 5-day window by 5 business days
  const anchor=current5Days[dir>0?4:0];
  let next=addD(anchor,dir>0?1:-1);
  while(!isBD(next)) next=addD(next,dir>0?1:-1);
  current5Days=[];
  let cur=new Date(next);
  if(dir<0){
    // go 4 more back
    for(let i=0;i<4;i++){ cur=addD(cur,-1); while(!isBD(cur))cur=addD(cur,-1); }
  }
  while(current5Days.length<5){ if(isBD(cur))current5Days.push(new Date(cur)); cur=addD(cur,1); }
  currentDayIndex=0;
  renderDay();
  updateStats();
}

function selectDay(idx){
  currentDayIndex=idx;
  renderDay();
}

/* ═══════════════════════════════════════════════════════════
   VIEW SWITCHING
═══════════════════════════════════════════════════════════ */
function setView(v){
  currentView=v;
  ['month','week','day'].forEach(x=>{
    document.getElementById(`view-${x}`).classList.toggle('active',x===v);
    document.getElementById(`vbtn-${x}`)?.classList.toggle('active',x===v);
    document.getElementById(`tvbtn-${x}`)?.classList.toggle('active',x===v);
  });
  updateTopbar();
  if(v==='month') renderMonth();
  if(v==='week') renderWeek();
  if(v==='day') renderDay();
  updateStats();
}

/* ═══════════════════════════════════════════════════════════
   PERSON FILTER
═══════════════════════════════════════════════════════════ */
function setPerson(key){
  currentPerson=key;
  document.querySelectorAll('.person-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`pbtn-${key}`)?.classList.add('active');
  renderPersonBanner();
  updateTopbar();
  if(currentView==='month') renderMonth();
  if(currentView==='week') renderWeek();
  if(currentView==='day') renderDay();
  updateStats();
}

function renderPersonBanner(){
  const el=document.getElementById('personBanner');
  if(currentPerson==='all'){ el.innerHTML=''; return; }
  const p=PEOPLE_DEF.find(x=>x.key===currentPerson);
  if(!p){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="person-banner">
    <div class="pb-avatar ${p.pcls}">${p.init}</div>
    <div class="pb-info">
      <div class="pb-name">Viewing: ${p.name}</div>
      <div class="pb-role">${p.role}</div>
    </div>
    <button class="pb-clear" onclick="setPerson('all')">Clear Filter</button>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════
   STATS
═══════════════════════════════════════════════════════════ */
function updateStats(){
  // Count tasks in current view window
  let days=[];
  if(currentView==='month'){
    const last=new Date(currentYear,currentMonth+1,0).getDate();
    for(let d=1;d<=last;d++){
      const dt=new Date(currentYear,currentMonth,d);
      if(isBD(dt)) days.push(dt);
    }
  } else if(currentView==='week'){
    for(let i=0;i<7;i++){
      const d=new Date(currentWeekStart.getTime()+i*86400000);
      if(isBD(d)) days.push(d);
    }
  } else {
    days=current5Days;
  }

  let total=0, payroll=0, milestones=0, hols=0;
  for(const d of days){
    const tasks=buildTasks(d);
    const filtered=filterTasks(tasks);
    const flat=Object.values(filtered).flat();
    total+=flat.length;
    payroll+=flat.filter(t=>t.type==='payroll').length;
    milestones+=flat.filter(t=>t.type==='milestone').length;
    hols+=getHols(d).length;
  }

  // Check for urgent alerts in window
  const alertEl=document.getElementById('alertContainer');
  const alerts=[];
  for(const d of days){
    const evts=PAYROLL_MAP.get(iso(d))||[];
    for(const ev of evts){
      if(ev.type==='CASH_DUE') alerts.push({cls:'red',icon:'🚨',title:`Cash Due — ${fmtS(d)}`,body:`Heirloom payroll funds must be in account by EOD. Pay date: ${fmtS(ev.payDate)}.`});
      if(ev.type==='REMIND_RED') alerts.push({cls:'yellow',icon:'⚠️',title:`Payroll Cash Due Tomorrow — ${fmtS(addBD(d,1))}`,body:`Final reminder: fund Heirloom payroll account today. Pay date: ${fmtS(ev.payDate)}.`});
    }
  }
  alertEl.innerHTML=alerts.map(a=>`<div class="alert-bar ${a.cls}"><div class="alert-icon">${a.icon}</div><div class="alert-content"><div class="alert-title">${a.title}</div><div class="alert-body">${a.body}</div></div></div>`).join('');

  document.getElementById('heroStats').innerHTML=`
    <div class="stat-chip sc-royal"><div class="sc-icon">📋</div><div class="sc-value">${total}</div><div class="sc-label">Total Tasks</div><div class="sc-sub">${currentView} view</div></div>
    <div class="stat-chip sc-red"><div class="sc-icon">💵</div><div class="sc-value">${payroll}</div><div class="sc-label">Payroll Events</div><div class="sc-sub">in window</div></div>
    <div class="stat-chip sc-navy"><div class="sc-icon">⭐</div><div class="sc-value">${milestones}</div><div class="sc-label">Milestones</div><div class="sc-sub">in window</div></div>
    <div class="stat-chip sc-green"><div class="sc-icon">🌍</div><div class="sc-value">${hols}</div><div class="sc-label">Holiday Flags</div><div class="sc-sub">🇮🇳 🇿🇦 🇺🇸</div></div>`;
}

function updateTopbar(){
  const pn=currentPerson==='all'?'All Team':PEOPLE_DEF.find(x=>x.key===currentPerson)?.name||'';
  const views={month:'Month view',week:'Week view',day:'Daily view'};
  document.getElementById('topbarTitle').textContent=`Operations Calendar`;
  document.getElementById('topbarSub').textContent=`${pn} · ${views[currentView]}`;
}

/* ═══════════════════════════════════════════════════════════
   SIDEBAR BUILD
═══════════════════════════════════════════════════════════ */
function buildSidebar(){
  // Count tasks per person for current period (rough estimate using next 5 BDs)
  const counts={};
  for(const p of PEOPLE_DEF){
    if(p.key==='all'){counts[p.key]=null;continue;}
    let c=0;
    for(const d of current5Days){ c+=(buildTasks(d)[p.key]||[]).length; }
    counts[p.key]=c;
  }

  const html=PEOPLE_DEF.map(p=>`
    <button class="person-btn ${currentPerson===p.key?'active':''}" id="pbtn-${p.key}" onclick="setPerson('${p.key}')">
      <div class="p-avatar ${p.cls}">${p.init}</div>
      <div class="p-name">${p.name}</div>
      ${counts[p.key]!==null?`<div class="p-badge">${counts[p.key]}</div>`:''}
    </button>`).join('');
  document.getElementById('personList').innerHTML=html;
}

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
function init(){
  const today=new Date();
  document.getElementById('topbarDate').textContent=
    today.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'});

  initDateState();

  // Set month to today's month if in range, else April
  if(today.getFullYear()===2026&&today.getMonth()>=3&&today.getMonth()<=11){
    currentMonth=today.getMonth();
    currentYear=2026;
  }

  buildSidebar();
  updateTopbar();
  renderMonth();
  updateStats();
}

document.addEventListener('DOMContentLoaded', init);
</script>
